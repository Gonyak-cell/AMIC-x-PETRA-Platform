# ============================================================
# AMIC x PETRA Platform — SSL/TLS Overlay
# ============================================================
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
#
# 사전 조건:
#   1. DNS A 레코드가 서버 IP를 가리키고 있어야 함
#   2. scripts/init-ssl.sh 실행하여 최초 인증서 발급
# ============================================================

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  # Certbot — SSL 인증서 자동 갱신
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    # 12시간마다 갱신 체크 (만료 30일 전에만 실제 갱신)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  certbot-etc:
  certbot-var:
  certbot-www:
