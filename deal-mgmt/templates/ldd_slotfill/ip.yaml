section_id: ip
version: "1.0"
source_reference: "AMIC curated LDD boilerplate v1"
slots:
  target_company: { level: L2, source: report.target_company, default: "대상회사" }
  item_name: { level: L2, source: item.name }
  status_sentence: { level: L2, source: derived.status_sentence }
  analysis_sentence: { level: L2, source: derived.analysis_sentence }
  impact_sentence: { level: L2, source: derived.impact_sentence }
  recommendation_sentence: { level: L2, source: derived.recommendation_sentence }
  evidence_sentence: { level: L2, source: derived.evidence_sentence }
  rfi_sentence: { level: L2, source: derived.rfi_sentence }
  user_review_sentence: { level: L2, source: derived.user_review_sentence, default: "" }
  confidence_sentence: { level: L2, source: derived.confidence_sentence, default: "" }
body: |
  [[FACTS]]
  {{@scope_notice}}
  당사는 {{ target_company }}의 지식재산권 및 기술 사용 관련 자료 중 {{ item_name }} 항목을 중심으로 검토하였습니다. {{ status_sentence }} {{ evidence_sentence }}

  [[ANALYSIS]]
  본 항목에서는 권리 귀속, 유효성, 사용권 범위, 제3자 침해 가능성 및 기술 이전 제한을 함께 검토합니다. {{ analysis_sentence }} {{ impact_sentence }} {{ confidence_sentence }}

  [[DEAL_IMPACT]]
  IP 관련 확인 결과는 핵심 기술 독점성, 영업 지속성, 라이선스 승계 및 향후 분쟁 노출 범위에 영향을 줄 수 있습니다. {{ user_review_sentence }}

  [[RECOMMENDATION]]
  현 단계 권고사항은 다음과 같습니다. {{ recommendation_sentence }} {{ rfi_sentence }}
conditional_blocks:
  - condition: issue_level in ('CRITICAL', 'HIGH')
    insert_after: impact_sentence
    text: "핵심 특허·상표·소프트웨어 권리의 귀속 불명확성은 거래 가치평가 및 post-closing 운영에 중대한 영향을 줄 수 있습니다."
  - condition: status == 'PENDING'
    insert_after: analysis_sentence
    text: "등록원부, 양수도계약, 라이선스 계약 및 오픈소스 정책 자료의 추가 확인이 필요할 수 있습니다."
