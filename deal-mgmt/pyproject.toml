[project]
name = "deal-mgmt"
version = "0.10.0"
description = "M&A Deal Management Service — 7단계 거래 워크플로우 관리 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "docxtpl>=0.16.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",
    "Pillow>=10.0.0",
    # Ralph Loop — 실사자료 파서
    "openpyxl>=3.1.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "olefile>=0.47",
    # Ralph Loop — LLM 프로바이더
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.0",
    # Task Queue
    "celery>=5.4.0",
    "redis>=5.2.0",
    # Azure Blob Storage (VDR)
    "azure-storage-blob[aio]>=12.20.0",
    # Fuzzy matching — VcCompany enrichment
    "rapidfuzz>=3.0.0",
    # OOXML 조작 — Redline Engine (Tracked Changes)
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line too long — Korean text + data dicts make 120-char limit impractical
    "B008",   # FastAPI Depends() in default args is intentional
    "B904",   # raise-without-from — gradual migration (29 occurrences)
    "RUF001", # ambiguous unicode char in string — intentional Korean text
    "RUF002", # ambiguous unicode char in docstring — intentional Korean text
    "RUF003", # ambiguous unicode char in comment — intentional Korean text
    "RUF012", # mutable-class-default — Pydantic models use mutable defaults by design
    "SIM102", # collapsible-if — intentional readability in validators/elif chains
    "SIM105", # suppressible-exception — try-except-pass 패턴 의도적 사용
    "SIM108", # if-else-block-instead-of-if-exp — 가독성 우선
    "UP042",  # StrEnum migration — keep str+Enum pattern for now
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# OOXML camelCase XML element names are conventional in python-pptx/python-docx
"app/pptx/memo_generator.py" = ["N806"]
"app/pptx/template_engine/*.py" = ["N806"]
"app/ralph/generators/ldd/law_firm_template.py" = ["N806"]
"app/ralph/generators/ldd/law_firm_renderer.py" = ["N806"]
"app/services/ldd_report_service.py" = ["N806"]
# Excel formula alias: 'formulas as F' is intentional shorthand
"app/excel/model_builder.py" = ["N812"]
# HWP parser / LLM client: imports used only for isinstance/availability check
"app/ralph/parsers/hwp_parser.py" = ["F401"]
"app/ralph/llm_client.py" = ["F401"]
# OOXML redline engine: camelCase XML element names are conventional
"app/services/redline_engine.py" = ["N806"]
# main.py: routers imported after app setup (FastAPI pattern)
"app/main.py" = ["E402"]
# Test files: Korean law names trigger N802, sys.path setup requires E402, Roman numeral chapter vars N806
# F841: test setup variables, B018: mock attribute access
"tests/*.py" = ["N802", "N806", "E402", "F841", "B018"]
# Script files: lenient import ordering, variable naming, error handling
# F401/F841: deferred imports and intermediate variables
"scripts/*.py" = ["E402", "E741", "E722", "N806", "B905", "F401", "F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml --cov-fail-under=60"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
