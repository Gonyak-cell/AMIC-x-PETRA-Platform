name: CI

on:
  push:
    branches: [master, develop, "feat/**", "rebuild/**"]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  WORKING_DIR: amic-platform

jobs:
  # ─── Stage 0: Change Detection ────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deal-mgmt: ${{ steps.filter.outputs.deal-mgmt }}
      deal-mgmt-visual: ${{ steps.filter.outputs.deal-mgmt-visual }}
      kiis: ${{ steps.filter.outputs.kiis }}
      fdd: ${{ steps.filter.outputs.fdd }}
      im: ${{ steps.filter.outputs.im }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.base_ref }}
          ref: ${{ github.sha }}
          filters: |
            deal-mgmt:
              - 'deal-mgmt/**'
            deal-mgmt-visual:
              - 'deal-mgmt/app/pptx/**'
              - 'deal-mgmt/templates/**'
              - 'deal-mgmt/tests/fixtures/golden_samples/**'
              - 'deal-mgmt/tests/visual_diff/**'
            kiis:
              - 'kiis/**'
            fdd:
              - 'fdd/**'
            im:
              - 'im/**'
            frontend:
              - 'amic-platform/**'
            ci-config:
              - '.github/workflows/**'
              - 'docker-compose*.yml'

  # ─── Stage 1: Backend Lint & Test (deal-mgmt) ─────────────────────
  backend-deal-mgmt:
    name: deal-mgmt Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.deal-mgmt == 'true' || needs.detect-changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deal-mgmt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff pytest pytest-asyncio httpx
      - name: Lint (ruff check)
        run: ruff check . --output-format=github
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          PYTEST_CMD=(
            pytest tests/ -v --tb=short
            --cov=app --cov-report=xml --cov-fail-under=60
            -k "not test_attachments"
            --ignore=tests/visual_diff
          )

          run_pytest() {
            "${PYTEST_CMD[@]}" 2>&1 | tee pytest-deal-mgmt.log
            return "${PIPESTATUS[0]}"
          }

          emit_failure_summary() {
            python -c "from pathlib import Path; import re; log_path = Path('pytest-deal-mgmt.log'); text = log_path.read_text(encoding='utf-8', errors='ignore') if log_path.exists() else ''; patterns = [r'^FAILED\\s+.+$', r'^ERROR\\s+.+$', r'^FAIL Required test coverage.+$']; matches = []; [matches.extend(re.findall(pattern, text, flags=re.MULTILINE)) for pattern in patterns]; deduped = []; [deduped.append(line) for line in matches if line not in deduped]; summary = (' | '.join(deduped[:12]).strip() or 'pytest exited non-zero without a parsed FAILED/ERROR line. Inspect pytest-deal-mgmt.log artifact.'); print(f'::error title=deal-mgmt unit tests::{summary[:1800]}')"
          }

          if ! run_pytest; then
            echo "deal-mgmt unit tests failed on first attempt; retrying once..."
            if ! run_pytest; then
              emit_failure_summary
              exit 1
            fi
          fi
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: test-jwt-secret-key
      - name: Upload deal-mgmt pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deal-mgmt-pytest-log
          path: deal-mgmt/pytest-deal-mgmt.log
          retention-days: 7
      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright
        continue-on-error: true
      - name: Coverage report
        if: github.event_name == 'pull_request' && always()
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: deal-mgmt/coverage.xml
          title: "deal-mgmt Coverage"
          unique-id-for-comment: deal-mgmt
        continue-on-error: true

  # ─── Stage 1B: Backend Auth Guard Test (KIIS) ───────────────────────
  backend-kiis:
    name: KIIS Backend Auth
    needs: detect-changes
    if: needs.detect-changes.outputs.kiis == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff pytest pytest-asyncio pytest-cov httpx aiosqlite python-jose[cryptography] bcrypt
      - name: Lint (ruff check)
        run: ruff check . --output-format=github
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Auth guard tests
        run: pytest tests/test_auth_guard.py -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: test-jwt-secret
          SECRET_KEY: test-secret-key
          AUTH_ENABLED: "true"
      - name: Corp basic service tests
        run: pytest tests/test_corp_basic_service.py -v --tb=short
      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright
        continue-on-error: true

  # ─── Stage 1C: Backend Lint & Test (FDD) ────────────────────────────
  backend-fdd:
    name: FDD Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.fdd == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdd/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # FDD requires Python >=3.12
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff pytest pytest-asyncio httpx aiosqlite
      - name: Lint (ruff check)
        run: ruff check . --output-format=github
      - name: Unit tests
        run: pytest tests/ -v --tb=short -m "not db" --ignore=tests/test_chart_api.py
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          AUTH_ENABLED: "false"

  # ─── Stage 1D: Backend Lint & Test (IM) ────────────────────────────
  backend-im:
    name: IM Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.im == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: im
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install ruff pytest pytest-asyncio
      - name: Lint (ruff check)
        run: ruff check src/ --output-format=github
      - name: Unit tests
        run: pytest tests/ -v --tb=short -m "not slow and not requires_browser"
        env:
          PYTHONPATH: ${{ github.workspace }}/im

  # ─── Stage 2: Lint + Typecheck (fast feedback) ─────────────────────
  quality:
    name: Lint & Typecheck
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit

  # ─── Stage 3: Unit Tests (parallel with build) ─────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, quality]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage/
          retention-days: 14

  # ─── Stage 3: Build (parallel with unit tests) ─────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [detect-changes, quality]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Bundle size report
        run: |
          echo '## Bundle Size Report'
          echo '| File | Size |'
          echo '|------|------|'
          du -b dist/assets/*.js | sort -rn | head -15 | while read size file; do
            hr=$(numfmt --to=iec-i --suffix=B "$size")
            name=$(basename "$file")
            if [ "$size" -gt 512000 ]; then
              echo "| :warning: $name | **$hr** |"
            else
              echo "| $name | $hr |"
            fi
          done
          echo ''
          total=$(du -sb dist/ | cut -f1)
          echo "Total dist: $(numfmt --to=iec-i --suffix=B "$total")"
          # Warn if any JS chunk exceeds 500KB
          oversized=$(du -b dist/assets/*.js | awk '$1 > 512000 {print $2}')
          if [ -n "$oversized" ]; then
            echo '::warning::Chunks exceeding 500KB detected — consider code-splitting'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 7

  # ─── Stage 4: E2E Tests (mocked, no backends needed) ───────────────
  e2e-test:
    name: E2E Tests (Mocked)
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run mocked E2E tests
        run: npm run test:e2e:deep
        timeout-minutes: 20
        continue-on-error: true
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ${{ env.WORKING_DIR }}/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ${{ env.WORKING_DIR }}/test-results/
          retention-days: 7

  # ─── Secrets Scan (always runs) ──────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Security SAST (Semgrep, advisory) ─────────────────────────────
  security-sast:
    name: Security SAST
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.deal-mgmt == 'true' ||
      needs.detect-changes.outputs.kiis == 'true' ||
      needs.detect-changes.outputs.fdd == 'true' ||
      needs.detect-changes.outputs.im == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: semgrep scan --config auto --config p/security-audit --sarif -o semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ─── Dependency Scan (Trivy FS + npm audit, advisory) ──────────────
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "table"
          exit-code: "0"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        working-directory: amic-platform
        run: |
          npm ci
          npm audit --audit-level=high || true

  # ─── Visual Diff Tests (deal-mgmt + IM: advisory) ─────────
  visual-diff-deal-mgmt:
    name: Visual Diff (deal-mgmt)
    needs: detect-changes
    if: needs.detect-changes.outputs.deal-mgmt-visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      FORCE_VISUAL_DIFF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: |
          timeout 5m sudo apt-get update
          timeout 8m sudo apt-get install -y --no-install-recommends libreoffice poppler-utils
      - name: Install deal-mgmt + visual diff deps
        working-directory: deal-mgmt
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install scikit-image pdf2image Pillow
      - name: Run deal-mgmt visual diff
        working-directory: deal-mgmt
        run: pytest tests/visual_diff/ -v --tb=short -o "addopts="
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET: test-jwt-secret-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deal-mgmt-visual-diff-results
          path: deal-mgmt/tests/visual_diff/output/
          retention-days: 14

  visual-diff-im:
    name: Visual Diff (IM)
    needs: detect-changes
    if: needs.detect-changes.outputs.im == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      FORCE_VISUAL_DIFF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: |
          timeout 5m sudo apt-get update
          timeout 8m sudo apt-get install -y --no-install-recommends libreoffice poppler-utils
      - name: Install IM + visual diff deps
        working-directory: im
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install scikit-image pdf2image Pillow
      - name: Run IM visual diff
        working-directory: im
        run: pytest tests/visual_diff/ -v --tb=short -o "addopts="
        env:
          PYTHONPATH: ${{ github.workspace }}/im
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: im-visual-diff-results
          path: im/tests/visual_diff/output/
          retention-days: 14

  # ─── Quality Gate (the ONLY required status check) ─────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend-deal-mgmt
      - backend-kiis
      - backend-fdd
      - backend-im
      - quality
      - unit-test
      - build
      - e2e-test
      - visual-diff-deal-mgmt
      - visual-diff-im
      - secrets-scan
      - security-sast
      - dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: >-
            backend-deal-mgmt, backend-kiis, backend-fdd, backend-im,
            quality, unit-test, build, e2e-test, visual-diff-deal-mgmt,
            visual-diff-im, security-sast, dependency-scan
          allowed-failures: backend-kiis, e2e-test, visual-diff-im, visual-diff-deal-mgmt, security-sast, dependency-scan
          jobs: ${{ toJSON(needs) }}
