name: Deploy

on:
  push:
    branches: [master, develop, feat/ma-workflow, "rebuild/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      scope:
        description: What to deploy (auto = detect changes)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - frontend-only
          - backend-only

permissions:
  checks: read
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ── CI Build 통과 대기 (push 이벤트만, workflow_dispatch는 즉시 배포) ──
  wait-for-ci:
    name: Wait for CI Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Wait for CI Build job to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAX_ATTEMPTS=160
          SLEEP_SECONDS=15
          echo "Waiting for CI Gate on commit ${{ github.sha }}..."
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            # CI Gate is the single required status check (alls-green)
            STATUS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name == "CI Gate") | .conclusion' 2>/dev/null || echo "")
            if [ "$STATUS" = "success" ]; then
              echo "CI Gate passed!"
              exit 0
            elif [ "$STATUS" = "failure" ]; then
              echo "CI Gate failed — aborting deploy"
              exit 1
            fi
            echo "  Attempt $i/$MAX_ATTEMPTS: CI Gate status='${STATUS:-pending}', waiting ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          echo "CI Gate did not complete within 40 minutes — aborting deploy"
          exit 1

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.wait-for-ci.result == 'success'))
    environment: ${{ github.event.inputs.environment || 'production' }}
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      HAS_AZURE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
      HAS_AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS != '' }}
      HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_AZURE_RECOVERY: ${{ secrets.AZURE_CREDENTIALS != '' || (secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '') || (secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_CLIENT_SECRET != '') }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH reachability
        id: ssh_probe_initial
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          echo "Checking SSH reachability to ${HOST}:22..."
          if timeout 5 bash -c ":</dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "SSH is reachable."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "SSH is unreachable."
            exit 1
          fi

      - name: Login to Azure for VM recovery via AZURE_CREDENTIALS
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          env.HAS_AZURE_CREDENTIALS == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Login to Azure for VM recovery via client secret
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          env.HAS_AZURE_CREDENTIALS != 'true' &&
          env.HAS_AZURE_CLIENT_SECRET == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ env.AZURE_CLIENT_SECRET }}

      - name: Login to Azure for VM recovery via OIDC
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          env.HAS_AZURE_CREDENTIALS != 'true' &&
          env.HAS_AZURE_CLIENT_SECRET != 'true' &&
          env.HAS_AZURE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Restart Azure VM when SSH is down
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          env.HAS_AZURE_RECOVERY == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            TARGET_IP="${{ secrets.DEPLOY_HOST }}"
            echo "Searching for Azure VM bound to public IP ${TARGET_IP}..."
            VM_INFO=$(az vm list -d --query "[?contains(publicIps, '${TARGET_IP}')] | [0].[name,resourceGroup,powerState,publicIps]" -o tsv)
            if [ -z "${VM_INFO}" ]; then
              echo "No Azure VM was found for public IP ${TARGET_IP}."
              exit 1
            fi

            IFS=$'\t' read -r VM_NAME RESOURCE_GROUP POWER_STATE PUBLIC_IPS <<< "${VM_INFO}"
            echo "Matched VM ${VM_NAME} in resource group ${RESOURCE_GROUP} (${POWER_STATE}; IPs=${PUBLIC_IPS})."

            case "${POWER_STATE}" in
              "VM stopped"|"VM deallocated")
                echo "VM is stopped. Starting it..."
                az vm start --resource-group "${RESOURCE_GROUP}" --name "${VM_NAME}"
                ;;
              *)
                echo "VM is not healthy enough for SSH. Restarting it..."
                az vm restart --resource-group "${RESOURCE_GROUP}" --name "${VM_NAME}"
                ;;
            esac

            echo "Waiting for Azure power state to report running..."
            for i in $(seq 1 20); do
              CURRENT_STATE=$(az vm get-instance-view --resource-group "${RESOURCE_GROUP}" --name "${VM_NAME}" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" -o tsv)
              echo "  Attempt ${i}/20: ${CURRENT_STATE}"
              if [ "${CURRENT_STATE}" = "VM running" ]; then
                exit 0
              fi
              sleep 15
            done

            echo "Azure VM did not reach running state in time."
            exit 1

      - name: Wait for SSH after VM recovery
        id: ssh_probe_recovered
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          env.HAS_AZURE_RECOVERY == 'true'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          echo "Waiting for SSH to recover on ${HOST}:22..."
          for i in $(seq 1 40); do
            if timeout 5 bash -c ":</dev/tcp/${HOST}/22" 2>/dev/null; then
              echo "reachable=true" >> "$GITHUB_OUTPUT"
              echo "SSH recovered on attempt ${i}/40."
              exit 0
            fi
            echo "  Attempt ${i}/40: SSH still unavailable, waiting 15s..."
            sleep 15
          done

          echo "reachable=false" >> "$GITHUB_OUTPUT"
          echo "SSH did not recover in time."
          exit 1

      - name: Abort when SSH recovery is unavailable
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          env.HAS_AZURE_RECOVERY != 'true'
        shell: bash
        run: |
          echo "SSH to ${{ secrets.DEPLOY_HOST }} is down and Azure OIDC secrets are not configured."
          echo "Configure AZURE_CREDENTIALS or AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (/ AZURE_CLIENT_SECRET), or recover the VM manually."
          exit 1

      - name: Abort when SSH is still down after recovery
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'false' &&
          steps.ssh_probe_recovered.outputs.reachable != 'true'
        shell: bash
        run: |
          echo "SSH to ${{ secrets.DEPLOY_HOST }} is still unavailable after VM recovery attempts."
          exit 1

      - name: Deploy via SSH
        if: >
          steps.ssh_probe_initial.outputs.reachable == 'true' ||
          steps.ssh_probe_recovered.outputs.reachable == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 35m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml"
            SCOPE="${{ github.event.inputs.scope || 'auto' }}"

            # ── 1. Pre-deploy backup ──
            echo "=== [1/6] DB Backup ==="
            if [ -f scripts/backup-all-dbs.sh ]; then
              bash scripts/backup-all-dbs.sh || echo "WARN: Backup failed, continuing..."
            fi

            # ── 2. Git pull ──
            echo "=== [2/6] Git Pull ==="
            PREV_COMMIT=$(git rev-parse HEAD)
            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"
            NEW_COMMIT=$(git rev-parse HEAD)

            if [ "$PREV_COMMIT" = "$NEW_COMMIT" ] && [ "$SCOPE" = "auto" ]; then
              echo "No changes detected. Skipping deployment."
              exit 0
            fi

            # ── 3. Detect changed services ──
            echo "=== [3/6] Detect Changes ==="
            CHANGED=$(git diff --name-only "$PREV_COMMIT" "$NEW_COMMIT" 2>/dev/null || echo "all")
            SERVICES=""
            MIGRATE_FDD=false
            MIGRATE_KIIS=false
            MIGRATE_IM=false
            MIGRATE_MA=false

            if [ "$SCOPE" = "all" ] || [ "$CHANGED" = "all" ]; then
              SERVICES="frontend nginx fdd-api kiis-api im-api im-celery-worker im-celery-beat deal-mgmt-api deal-mgmt-celery-worker"
              MIGRATE_FDD=true; MIGRATE_KIIS=true; MIGRATE_IM=true; MIGRATE_MA=true
            elif [ "$SCOPE" = "frontend-only" ]; then
              SERVICES="frontend nginx"
            elif [ "$SCOPE" = "backend-only" ]; then
              SERVICES="fdd-api kiis-api im-api im-celery-worker im-celery-beat deal-mgmt-api deal-mgmt-celery-worker"
              MIGRATE_FDD=true; MIGRATE_KIIS=true; MIGRATE_IM=true; MIGRATE_MA=true
            else
              # auto: detect from changed files
              echo "$CHANGED" | grep -q "amic-platform/"  && SERVICES="$SERVICES frontend nginx"
              echo "$CHANGED" | grep -q "nginx/"           && SERVICES="$SERVICES nginx"
              echo "$CHANGED" | grep -q "fdd/"             && SERVICES="$SERVICES fdd-api" && MIGRATE_FDD=true
              echo "$CHANGED" | grep -q "kiis/"            && SERVICES="$SERVICES kiis-api" && MIGRATE_KIIS=true
              echo "$CHANGED" | grep -qE "^im/"            && SERVICES="$SERVICES im-api im-celery-worker im-celery-beat" && MIGRATE_IM=true
              # deal-mgmt test/docs-only changes should not trigger an MA redeploy.
              echo "$CHANGED" | grep -qE "^deal-mgmt/(app|data|generated|migrations|scripts|templates)/|^deal-mgmt/(alembic[.]ini|Dockerfile|pyproject[.]toml|uv[.]lock)$" \
                && SERVICES="$SERVICES deal-mgmt-api deal-mgmt-celery-worker" && MIGRATE_MA=true
            fi

            # Deduplicate
            SERVICES=$(echo "$SERVICES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

            if [ -z "$SERVICES" ]; then
              echo "No relevant services to rebuild. Skipping."
              exit 0
            fi

            echo "Services to rebuild: $SERVICES"
            has_service() {
              echo " $SERVICES " | grep -q " $1 "
            }

            CHECK_TARGETS=""
            if has_service "fdd-api"; then
              CHECK_TARGETS="$CHECK_TARGETS fdd-api:fdd"
            fi
            if has_service "kiis-api"; then
              CHECK_TARGETS="$CHECK_TARGETS kiis-api:kiis"
            fi
            if has_service "im-api"; then
              CHECK_TARGETS="$CHECK_TARGETS im-api:im"
            fi
            if has_service "deal-mgmt-api"; then
              CHECK_TARGETS="$CHECK_TARGETS deal-mgmt-api:ma"
            fi
            CHECK_TARGETS=$(echo "$CHECK_TARGETS" | xargs)

            CHECK_FRONTEND=false
            if has_service "frontend" || has_service "nginx"; then
              CHECK_FRONTEND=true
            fi

            # ── 3.5. Environment validation ──
            echo "=== [3.5/8] Environment Validation ==="
            REQUIRED_VARS=""
            if [ "$MIGRATE_FDD" = true ] || [ "$MIGRATE_KIIS" = true ] || [ "$MIGRATE_IM" = true ] || [ "$MIGRATE_MA" = true ]; then
              REQUIRED_VARS="$REQUIRED_VARS SHARED_JWT_SECRET"
            fi
            if [ "$MIGRATE_FDD" = true ]; then
              REQUIRED_VARS="$REQUIRED_VARS FDD_DB_PASSWORD FDD_CORS_ORIGINS"
            fi
            if [ "$MIGRATE_KIIS" = true ]; then
              REQUIRED_VARS="$REQUIRED_VARS KIIS_DB_PASSWORD KIIS_CORS_ORIGINS KIIS_REDIS_PASSWORD KIIS_ES_PASSWORD"
            fi
            if [ "$MIGRATE_IM" = true ]; then
              REQUIRED_VARS="$REQUIRED_VARS IM_DB_PASSWORD IM_CORS_ORIGINS IM_REDIS_PASSWORD"
            fi
            if [ "$MIGRATE_MA" = true ]; then
              REQUIRED_VARS="$REQUIRED_VARS MA_DB_PASSWORD MA_CORS_ORIGINS MA_REDIS_PASSWORD"
            fi
            REQUIRED_VARS=$(echo "$REQUIRED_VARS" | xargs)
            if [ -z "$REQUIRED_VARS" ]; then
              echo "  No backend env vars required for this deployment scope."
            else
              echo "  Validating env vars for changed backend services only."
            fi
            MISSING=""
            for VAR in $REQUIRED_VARS; do
              VAL=$(grep "^${VAR}=" .env 2>/dev/null | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                echo "  MISSING: $VAR"
                MISSING="$MISSING $VAR"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "CRITICAL: Missing required env vars:$MISSING"
              echo "Aborting deployment."
              exit 1
            fi
            echo "  All required env vars present."

            # ── 3.6. CORS format validation ──
            # KIIS/IM/MA는 list[str] (JSON 배열) 형식 필수.
            # FDD만 str (쉼표 구분) 형식.
            echo "=== [3.6/8] CORS Format Validation ==="
            JSON_CORS_VARS=""
            if [ "$MIGRATE_KIIS" = true ]; then
              JSON_CORS_VARS="$JSON_CORS_VARS KIIS_CORS_ORIGINS"
            fi
            if [ "$MIGRATE_IM" = true ]; then
              JSON_CORS_VARS="$JSON_CORS_VARS IM_CORS_ORIGINS"
            fi
            if [ "$MIGRATE_MA" = true ]; then
              JSON_CORS_VARS="$JSON_CORS_VARS MA_CORS_ORIGINS"
            fi
            JSON_CORS_VARS=$(echo "$JSON_CORS_VARS" | xargs)
            if [ -z "$JSON_CORS_VARS" ]; then
              echo "  No JSON-array CORS vars required for this deployment scope."
            fi
            FORMAT_ERR=""
            for SVC_VAR in $JSON_CORS_VARS; do
              VAL=$(grep "^${SVC_VAR}=" .env 2>/dev/null | cut -d= -f2-)
              if [ -n "$VAL" ] && ! echo "$VAL" | grep -qE '^\['; then
                echo "  ERROR: $SVC_VAR must be JSON array (e.g. [\"https://...\"])"
                echo "  Got: $VAL"
                FORMAT_ERR="$FORMAT_ERR $SVC_VAR"
              fi
            done
            if [ -n "$FORMAT_ERR" ]; then
              echo "CRITICAL: CORS format errors:$FORMAT_ERR"
              echo "Aborting deployment."
              exit 1
            fi
            echo "  All CORS formats valid."

            # ── 4. Build & restart ──
            # image: 태그가 명시되어 BuildKit 이미지 스왑 방지됨 (--no-cache 불필요)
            echo "=== [4/8] Build & Restart ==="
            $COMPOSE build $SERVICES
            $COMPOSE up -d $SERVICES

            # Reload nginx to pick up new upstream container IPs after recreation
            $COMPOSE exec -T nginx nginx -s reload 2>/dev/null || true

            # Wait for containers to be ready (IM depends_on chain can take 60s+)
            sleep 30

            # ── 5. DB Migrations ──
            # Each module runs independently — one failure does not block others
            echo "=== [5/6] DB Migrations ==="
            run_migration() {
              local SVC=$1
              local LABEL=$2
              echo "  Running $LABEL migrations..."
              echo "  $LABEL: current revision:"
              $COMPOSE exec -T "$SVC" alembic current 2>&1 || true
              if $COMPOSE exec -T "$SVC" alembic upgrade head 2>&1; then
                echo "  $LABEL: OK"
                return 0
              fi
              # Do NOT stamp head — stamping without running migrations causes
              # column-not-found errors at runtime (see KIIS dashboard 500 incident).
              # Migration failures must be fixed manually.
              echo "  CRITICAL: $LABEL migration failed — manual intervention required"
              echo "  $LABEL: check migration files and DB state, then run: alembic upgrade head"
              return 1
            }

            MIGRATE_FAILURES=""
            if [ "$MIGRATE_FDD" = true ]; then
              run_migration "fdd-api" "FDD" || MIGRATE_FAILURES="$MIGRATE_FAILURES FDD"
            fi
            if [ "$MIGRATE_KIIS" = true ]; then
              run_migration "kiis-api" "KIIS" || MIGRATE_FAILURES="$MIGRATE_FAILURES KIIS"
            fi
            if [ "$MIGRATE_IM" = true ]; then
              run_migration "im-api" "IM" || MIGRATE_FAILURES="$MIGRATE_FAILURES IM"
            fi
            if [ "$MIGRATE_MA" = true ]; then
              run_migration "deal-mgmt-api" "MA" || MIGRATE_FAILURES="$MIGRATE_FAILURES MA"
            fi

            if [ -n "$MIGRATE_FAILURES" ]; then
              echo ""
              echo "CRITICAL: Migration failures in:$MIGRATE_FAILURES"
              echo "Aborting deployment. Fix the migrations, then re-run this deployment."
              exit 1
            fi

            # ── 5.5. SI Company Data Seed ──
            # 기업개황 CSV 11만건을 si_companies 테이블에 적재 (idempotent UPSERT)
            echo "=== [5.5/8] SI Company Data Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              echo "  Checking SI company data..."
              # NOTE: DB 직접 쿼리 사용 (API는 JWT 인증 필요하므로 deploy 시 호출 불가)
              SI_STATS=$($COMPOSE exec -T deal-mgmt-api python -m scripts.db_stats 2>/dev/null || echo '{}')
              SI_COUNT=$(echo "$SI_STATS" | python3 -c "import sys,json;print(json.load(sys.stdin).get('si_companies_count',0))" 2>/dev/null || echo "0")
              if [ "$SI_COUNT" -lt 1000 ]; then
                echo "  SI companies: $SI_COUNT — running seed..."
                $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_company_data 2>&1 || \
                  echo "  WARN: SI seed failed (non-blocking)"
              else
                echo "  SI companies: $SI_COUNT — already seeded, skipping."
              fi
            else
              echo "  MA not changed — skipping SI seed."
            fi

            # ── 5.6. SI Revenue Data Seed ──
            # 금융위 기업재무정보 API로 매출액 수집 (idempotent, 점진적)
            echo "=== [5.6/8] SI Revenue Data Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              # Re-query stats after potential 5.5 seed
              SI_STATS=$($COMPOSE exec -T deal-mgmt-api python -m scripts.db_stats 2>/dev/null || echo '{}')
              NULL_REV=$(echo "$SI_STATS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('si_companies_count',0)-d.get('revenue_count',0))" 2>/dev/null || echo "0")
              if [ "$NULL_REV" -gt 1000 ]; then
                echo "  Revenue NULL: $NULL_REV — running revenue seed (limit=1500)..."
                timeout 300 $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_revenue_data --limit 1500 2>&1 || \
                  echo "  WARN: Revenue seed incomplete (non-blocking, will continue next deploy)"
              else
                echo "  Revenue data sufficient — skipping."
              fi
            else
              echo "  MA not changed — skipping revenue seed."
            fi

            # ── 5.7. SI Corp Basic Data Seed ──
            # 금융위 기업기본정보 API로 대표자/설립일/주소 등 수집 (idempotent, 점진적)
            echo "=== [5.7/8] SI Corp Basic Data Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              NOT_SYNCED=$(echo "$SI_STATS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('si_companies_count',0)-d.get('corp_basic_count',0))" 2>/dev/null || echo "0")
              if [ "$NOT_SYNCED" -gt 1000 ]; then
                echo "  SI companies: $NOT_SYNCED — running corp basic seed (limit=1500)..."
                timeout 300 $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_corp_basic_data --limit 1500 2>&1 || \
                  echo "  WARN: Corp basic seed incomplete (non-blocking, will continue next deploy)"
              else
                echo "  Corp basic data sufficient — skipping."
              fi
            else
              echo "  MA not changed — skipping corp basic seed."
            fi

            # ── 5.7.1. MA PEF Registry Seed ──
            # 금감원 기관전용 PEF 레지스트리 (idempotent — 100건 이상이면 스킵)
            echo "=== [5.7.1] MA PEF Registry Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              PEF_COUNT=$(echo "$SI_STATS" | python3 -c "import sys,json;print(json.load(sys.stdin).get('pef_fund_registry_count',0))" 2>/dev/null || echo "0")
              if [ "$PEF_COUNT" -lt 100 ]; then
                echo "  PEF registry: $PEF_COUNT — running seed..."
                timeout 120 $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_pef_registry 2>&1 || \
                  echo "  WARN: PEF registry seed failed (non-blocking)"
              else
                echo "  PEF registry: $PEF_COUNT — already seeded, skipping."
              fi
            else
              echo "  MA not changed — skipping PEF registry seed."
            fi

            # ── 5.7.2. MA GP Profile Seed ──
            # GP 프로필 데이터 시딩 (idempotent — 100건 이상이면 스킵)
            echo "=== [5.7.2] MA GP Profile Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              GP_COUNT=$(echo "$SI_STATS" | python3 -c "import sys,json;print(json.load(sys.stdin).get('gp_profiles_count',0))" 2>/dev/null || echo "0")
              if [ "$GP_COUNT" -lt 100 ]; then
                echo "  GP profiles: $GP_COUNT — running seed..."
                timeout 120 $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_gp_profiles 2>&1 || \
                  echo "  WARN: GP profile seed failed (non-blocking)"
              else
                echo "  GP profiles: $GP_COUNT — already seeded, skipping."
              fi
            else
              echo "  MA not changed — skipping GP profile seed."
            fi

            # ── 5.8. KIIS FSS PEF GP Data Seed ──
            # 금감원 기관전용 PEF 엑셀에서 GP 전수목록 + 총약정액 합산 (idempotent UPSERT)
            echo "=== [5.8/8] KIIS FSS PEF GP Seed ==="
            if [ "$MIGRATE_KIIS" = true ]; then
              echo "  Checking PEF fund data..."
              KIIS_STATS=$($COMPOSE exec -T kiis-api python -m scripts.db_stats 2>/dev/null || echo '{}')
              PEF_COUNT=$(echo "$KIIS_STATS" | python3 -c "import sys,json;print(json.load(sys.stdin).get('pef_funds_count',0))" 2>/dev/null || echo "0")
              if [ "$PEF_COUNT" -lt 100 ]; then
                echo "  PEF funds: $PEF_COUNT — running FSS PEF seed..."
                timeout 120 $COMPOSE exec -T kiis-api python -m scripts.seed_fss_pef data/fss_pef.xlsx 2>&1 || \
                  echo "  WARN: FSS PEF seed failed (non-blocking)"
              else
                echo "  PEF funds: $PEF_COUNT — already seeded, skipping."
              fi
            else
              echo "  KIIS not changed — skipping FSS PEF seed."
            fi

            # ── 6. Health check + rollback (with retries) ──
            # NOTE: Use docker exec to curl backends directly (bypass nginx SSL redirect)
            echo "=== [6/6] Health Check ==="
            if [ -n "$CHECK_TARGETS" ]; then
              echo "  Backend targets: $(echo "$CHECK_TARGETS" | tr ' ' '\n' | cut -d: -f2 | xargs)"
            else
              echo "  Backend targets: none"
            fi
            if [ "$CHECK_FRONTEND" = true ]; then
              echo "  Frontend target: enabled"
            else
              echo "  Frontend target: skipped"
            fi
            HEALTH_OK=false
            for ATTEMPT in 1 2 3; do
              echo "  Attempt $ATTEMPT/3 (waiting 15s)..."
              sleep 15
              HEALTH_OK=true

              # Backend API health checks (direct to container, bypass nginx)
              if [ -n "$CHECK_TARGETS" ]; then
                for svc_ep in $CHECK_TARGETS; do
                SVC=$(echo "$svc_ep" | cut -d: -f1)
                LABEL=$(echo "$svc_ep" | cut -d: -f2)
                RESPONSE=$($COMPOSE exec -T "$SVC" python3 -c "import urllib.request as u,sys;r=u.urlopen('http://localhost:8000/health',timeout=10);print(r.read().decode())" 2>/dev/null || echo '{}')
                STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
                MIGR=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('migration_ok','N/A'))" 2>/dev/null || echo "N/A")
                DB=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db','N/A'))" 2>/dev/null || echo "N/A")
                SVC_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('service','unknown'))" 2>/dev/null || echo "unknown")
                # Determine expected service name for image-swap detection
                case "$LABEL" in
                  ma) EXPECTED_SVC="deal-mgmt" ;;
                  *) EXPECTED_SVC="$LABEL" ;;
                esac

                # PASS: correct service identity + responding + migration OK
                # WARN: db=error (service running but DB unreachable)
                # FAIL: wrong service name (image swap) / not responding / migration failed
                if [ "$STATUS" != "unknown" ] && [ "$SVC_NAME" = "$EXPECTED_SVC" ] && [ "$MIGR" != "False" ]; then
                  if [ "$DB" = "error" ]; then
                    echo "    $LABEL: OK (status=$STATUS, db=$DB ⚠, migration=$MIGR, service=$SVC_NAME)"
                  else
                    echo "    $LABEL: OK (status=$STATUS, db=$DB, migration=$MIGR, service=$SVC_NAME)"
                  fi
                else
                  echo "    $LABEL: FAILED (status=$STATUS, db=$DB, migration=$MIGR, service=$SVC_NAME)"
                  echo "    DEBUG[$LABEL]: raw='$RESPONSE'"
                  $COMPOSE logs "$SVC" --tail=10 2>/dev/null | head -15 || true
                  HEALTH_OK=false
                fi
              done
              fi

              # Frontend check (via nginx → frontend upstream)
              if [ "$CHECK_FRONTEND" = true ]; then
                if $COMPOSE exec -T nginx wget -qO/dev/null --timeout=10 http://frontend:80/ 2>/dev/null; then
                  echo "    frontend: OK"
                else
                  echo "    frontend: FAILED"
                  HEALTH_OK=false
                fi
              fi

              if [ "$HEALTH_OK" = true ]; then
                echo "  All checks passed on attempt $ATTEMPT"
                break
              elif [ "$ATTEMPT" -lt 3 ]; then
                echo "  Some checks failed, retrying..."
              fi
            done

            if [ "$HEALTH_OK" = false ]; then
              echo ""
              echo "!!! HEALTH CHECK FAILED after 3 attempts — Rolling back to $PREV_COMMIT !!!"
              git checkout "$BRANCH"
              git reset --hard "$PREV_COMMIT"
              $COMPOSE build $SERVICES
              $COMPOSE up -d $SERVICES
              echo "Rollback complete"
              exit 1
            fi

            # ── 7. Stability re-check (catch post-startup crashes) ──
            echo "=== [7/8] Stability Check (30s wait) ==="
            sleep 30
            STABLE=true
            if [ -n "$CHECK_TARGETS" ]; then
              for svc_ep in $CHECK_TARGETS; do
                SVC=$(echo "$svc_ep" | cut -d: -f1)
                LABEL=$(echo "$svc_ep" | cut -d: -f2)
                RESPONSE=$($COMPOSE exec -T "$SVC" python3 -c "import urllib.request as u,sys;r=u.urlopen('http://localhost:8000/health',timeout=10);print(r.read().decode())" 2>/dev/null || echo '{}')
                STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
                if [ "$STATUS" = "ok" ]; then
                  echo "    $LABEL: STABLE"
                else
                  echo "    $LABEL: CRASHED (status=$STATUS)"
                  STABLE=false
                fi
              done
            fi

            # ── 8. Container logs (always capture for debugging) ──
            echo "=== [8/8] Container Logs ==="
            echo "--- docker stats (snapshot) ---"
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>/dev/null || true
            echo ""
            for SVC in $SERVICES; do
              echo "--- $SVC (last 30 lines) ---"
              $COMPOSE logs --tail=30 "$SVC" 2>&1 || true
              echo ""
            done

            if [ "$STABLE" = false ]; then
              echo ""
              echo "WARNING: Some services crashed after initial health check."
              echo "Check container logs above for details."
              echo "Attempting restart of failed services..."
              $COMPOSE up -d $SERVICES
              sleep 15
            fi

            # Post-deploy diagnostic
            if [ -f scripts/diagnose-production.sh ]; then
              bash scripts/diagnose-production.sh --ci || echo "WARN: Diagnostic reported issues (see above)"
            fi

            echo ""
            echo "=== Deployment complete ==="
