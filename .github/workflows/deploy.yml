name: Deploy

on:
  push:
    branches: [master, develop, feat/ma-workflow]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      scope:
        description: What to deploy (auto = detect changes)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - frontend-only
          - backend-only

permissions:
  checks: read
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  # ── CI Build 통과 대기 (push 이벤트만, workflow_dispatch는 즉시 배포) ──
  wait-for-ci:
    name: Wait for CI Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Wait for CI Build job to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for CI Gate on commit ${{ github.sha }}..."
          for i in $(seq 1 80); do
            # CI Gate is the single required status check (alls-green)
            STATUS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '.check_runs[] | select(.name == "CI Gate") | .conclusion' 2>/dev/null || echo "")
            if [ "$STATUS" = "success" ]; then
              echo "CI Gate passed!"
              exit 0
            elif [ "$STATUS" = "failure" ]; then
              echo "CI Gate failed — aborting deploy"
              exit 1
            fi
            echo "  Attempt $i/40: CI Gate status='${STATUS:-pending}', waiting 15s..."
            sleep 15
          done
          echo "CI Gate did not complete within 20 minutes — aborting deploy"
          exit 1

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.wait-for-ci.result == 'success'))
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 35m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml"
            SCOPE="${{ github.event.inputs.scope || 'auto' }}"

            # ── 1. Pre-deploy backup ──
            echo "=== [1/6] DB Backup ==="
            if [ -f scripts/backup-all-dbs.sh ]; then
              bash scripts/backup-all-dbs.sh || echo "WARN: Backup failed, continuing..."
            fi

            # ── 2. Git pull ──
            echo "=== [2/6] Git Pull ==="
            PREV_COMMIT=$(git rev-parse HEAD)
            BRANCH="${{ github.ref_name }}"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" 2>/dev/null || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"
            NEW_COMMIT=$(git rev-parse HEAD)

            if [ "$PREV_COMMIT" = "$NEW_COMMIT" ] && [ "$SCOPE" = "auto" ]; then
              echo "No changes detected. Skipping deployment."
              exit 0
            fi

            # ── 3. Detect changed services ──
            echo "=== [3/6] Detect Changes ==="
            CHANGED=$(git diff --name-only "$PREV_COMMIT" "$NEW_COMMIT" 2>/dev/null || echo "all")
            SERVICES=""
            MIGRATE_FDD=false
            MIGRATE_KIIS=false
            MIGRATE_IM=false
            MIGRATE_MA=false

            if [ "$SCOPE" = "all" ] || [ "$CHANGED" = "all" ]; then
              SERVICES="frontend nginx fdd-api kiis-api im-api im-celery-worker im-celery-beat deal-mgmt-api"
              MIGRATE_FDD=true; MIGRATE_KIIS=true; MIGRATE_IM=true; MIGRATE_MA=true
            elif [ "$SCOPE" = "frontend-only" ]; then
              SERVICES="frontend nginx"
            elif [ "$SCOPE" = "backend-only" ]; then
              SERVICES="fdd-api kiis-api im-api im-celery-worker im-celery-beat deal-mgmt-api"
              MIGRATE_FDD=true; MIGRATE_KIIS=true; MIGRATE_IM=true; MIGRATE_MA=true
            else
              # auto: detect from changed files
              echo "$CHANGED" | grep -q "amic-platform/"  && SERVICES="$SERVICES frontend nginx"
              echo "$CHANGED" | grep -q "nginx/"           && SERVICES="$SERVICES nginx"
              echo "$CHANGED" | grep -q "fdd/"             && SERVICES="$SERVICES fdd-api" && MIGRATE_FDD=true
              echo "$CHANGED" | grep -q "kiis/"            && SERVICES="$SERVICES kiis-api" && MIGRATE_KIIS=true
              echo "$CHANGED" | grep -qE "^im/"            && SERVICES="$SERVICES im-api im-celery-worker im-celery-beat" && MIGRATE_IM=true
              echo "$CHANGED" | grep -q "deal-mgmt/"       && SERVICES="$SERVICES deal-mgmt-api" && MIGRATE_MA=true
            fi

            # Deduplicate
            SERVICES=$(echo "$SERVICES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

            if [ -z "$SERVICES" ]; then
              echo "No relevant services to rebuild. Skipping."
              exit 0
            fi

            echo "Services to rebuild: $SERVICES"

            # ── 3.5. Environment validation ──
            echo "=== [3.5/8] Environment Validation ==="
            MISSING=""
            for VAR in SHARED_JWT_SECRET FDD_DB_PASSWORD FDD_CORS_ORIGINS \
                       KIIS_DB_PASSWORD KIIS_CORS_ORIGINS \
                       IM_DB_PASSWORD IM_CORS_ORIGINS \
                       MA_DB_PASSWORD MA_CORS_ORIGINS; do
              VAL=$(grep "^${VAR}=" .env 2>/dev/null | cut -d= -f2-)
              if [ -z "$VAL" ]; then
                echo "  MISSING: $VAR"
                MISSING="$MISSING $VAR"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "CRITICAL: Missing required env vars:$MISSING"
              echo "Aborting deployment."
              exit 1
            fi
            echo "  All required env vars present."

            # ── 3.6. CORS format validation ──
            # KIIS/IM/MA는 list[str] (JSON 배열) 형식 필수.
            # FDD만 str (쉼표 구분) 형식.
            echo "=== [3.6/8] CORS Format Validation ==="
            FORMAT_ERR=""
            for SVC_VAR in KIIS_CORS_ORIGINS IM_CORS_ORIGINS MA_CORS_ORIGINS; do
              VAL=$(grep "^${SVC_VAR}=" .env 2>/dev/null | cut -d= -f2-)
              if [ -n "$VAL" ] && ! echo "$VAL" | grep -qE '^\['; then
                echo "  ERROR: $SVC_VAR must be JSON array (e.g. [\"https://...\"])"
                echo "  Got: $VAL"
                FORMAT_ERR="$FORMAT_ERR $SVC_VAR"
              fi
            done
            if [ -n "$FORMAT_ERR" ]; then
              echo "CRITICAL: CORS format errors:$FORMAT_ERR"
              echo "Aborting deployment."
              exit 1
            fi
            echo "  All CORS formats valid."

            # ── 4. Build & restart ──
            # image: 태그가 명시되어 BuildKit 이미지 스왑 방지됨 (--no-cache 불필요)
            echo "=== [4/8] Build & Restart ==="
            $COMPOSE build $SERVICES
            $COMPOSE up -d $SERVICES

            # Reload nginx to pick up new upstream container IPs after recreation
            $COMPOSE exec -T nginx nginx -s reload 2>/dev/null || true

            # Wait for containers to be ready (IM depends_on chain can take 60s+)
            sleep 30

            # ── 5. DB Migrations ──
            # Each module runs independently — one failure does not block others
            echo "=== [5/6] DB Migrations ==="
            run_migration() {
              local SVC=$1
              local LABEL=$2
              echo "  Running $LABEL migrations..."
              if $COMPOSE exec -T "$SVC" alembic upgrade head 2>&1; then
                echo "  $LABEL: OK"
                return 0
              fi
              # Fallback: tables may exist but alembic_version is empty → stamp head
              echo "  $LABEL: upgrade failed, trying stamp head..."
              if $COMPOSE exec -T "$SVC" alembic stamp head 2>&1; then
                echo "  $LABEL: stamped to head (tables existed without alembic tracking)"
                return 0
              fi
              echo "  CRITICAL: $LABEL migration and stamp both failed"
              return 1
            }

            MIGRATE_FAILURES=""
            if [ "$MIGRATE_FDD" = true ]; then
              run_migration "fdd-api" "FDD" || MIGRATE_FAILURES="$MIGRATE_FAILURES FDD"
            fi
            if [ "$MIGRATE_KIIS" = true ]; then
              run_migration "kiis-api" "KIIS" || MIGRATE_FAILURES="$MIGRATE_FAILURES KIIS"
            fi
            if [ "$MIGRATE_IM" = true ]; then
              run_migration "im-api" "IM" || MIGRATE_FAILURES="$MIGRATE_FAILURES IM"
            fi
            if [ "$MIGRATE_MA" = true ]; then
              run_migration "deal-mgmt-api" "MA" || MIGRATE_FAILURES="$MIGRATE_FAILURES MA"
            fi

            if [ -n "$MIGRATE_FAILURES" ]; then
              echo ""
              echo "WARNING: Migration failures in:$MIGRATE_FAILURES"
              echo "Continuing with health checks (migrations may need manual intervention)..."
            fi

            # ── 5.5. SI Company Data Seed ──
            # 기업개황 CSV 11만건을 si_companies 테이블에 적재 (idempotent UPSERT)
            echo "=== [5.5/8] SI Company Data Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              echo "  Checking SI company data..."
              # NOTE: DB 직접 쿼리 사용 (API는 JWT 인증 필요하므로 deploy 시 호출 불가)
              SI_STATS=$($COMPOSE exec -T deal-mgmt-api python -m scripts.db_stats 2>/dev/null || echo '{}')
              SI_COUNT=$(echo "$SI_STATS" | python3 -c "import sys,json;print(json.load(sys.stdin).get('si_companies_count',0))" 2>/dev/null || echo "0")
              if [ "$SI_COUNT" -lt 1000 ]; then
                echo "  SI companies: $SI_COUNT — running seed..."
                $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_company_data 2>&1 || \
                  echo "  WARN: SI seed failed (non-blocking)"
              else
                echo "  SI companies: $SI_COUNT — already seeded, skipping."
              fi
            else
              echo "  MA not changed — skipping SI seed."
            fi

            # ── 5.6. SI Revenue Data Seed ──
            # 금융위 기업재무정보 API로 매출액 수집 (idempotent, 점진적)
            echo "=== [5.6/8] SI Revenue Data Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              # Re-query stats after potential 5.5 seed
              SI_STATS=$($COMPOSE exec -T deal-mgmt-api python -m scripts.db_stats 2>/dev/null || echo '{}')
              NULL_REV=$(echo "$SI_STATS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('si_companies_count',0)-d.get('revenue_count',0))" 2>/dev/null || echo "0")
              if [ "$NULL_REV" -gt 1000 ]; then
                echo "  Revenue NULL: $NULL_REV — running revenue seed (limit=1500)..."
                timeout 1200 $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_revenue_data --limit 1500 2>&1 || \
                  echo "  WARN: Revenue seed incomplete (non-blocking, will continue next deploy)"
              else
                echo "  Revenue data sufficient — skipping."
              fi
            else
              echo "  MA not changed — skipping revenue seed."
            fi

            # ── 5.7. SI Corp Basic Data Seed ──
            # 금융위 기업기본정보 API로 대표자/설립일/주소 등 수집 (idempotent, 점진적)
            echo "=== [5.7/8] SI Corp Basic Data Seed ==="
            if [ "$MIGRATE_MA" = true ]; then
              NOT_SYNCED=$(echo "$SI_STATS" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('si_companies_count',0)-d.get('corp_basic_count',0))" 2>/dev/null || echo "0")
              if [ "$NOT_SYNCED" -gt 1000 ]; then
                echo "  SI companies: $NOT_SYNCED — running corp basic seed (limit=1500)..."
                timeout 1200 $COMPOSE exec -T deal-mgmt-api python -m scripts.seed_corp_basic_data --limit 1500 2>&1 || \
                  echo "  WARN: Corp basic seed incomplete (non-blocking, will continue next deploy)"
              else
                echo "  Corp basic data sufficient — skipping."
              fi
            else
              echo "  MA not changed — skipping corp basic seed."
            fi

            # ── 6. Health check + rollback (with retries) ──
            # NOTE: Use docker exec to curl backends directly (bypass nginx SSL redirect)
            echo "=== [6/6] Health Check ==="
            HEALTH_OK=false
            for ATTEMPT in 1 2 3; do
              echo "  Attempt $ATTEMPT/3 (waiting 15s)..."
              sleep 15
              HEALTH_OK=true

              # Backend API health checks (direct to container, bypass nginx)
              for svc_ep in "fdd-api fdd" "kiis-api kiis" "im-api im" "deal-mgmt-api ma"; do
                SVC=$(echo "$svc_ep" | cut -d' ' -f1)
                LABEL=$(echo "$svc_ep" | cut -d' ' -f2)
                RESPONSE=$($COMPOSE exec -T "$SVC" python3 -c "import urllib.request as u,sys;r=u.urlopen('http://localhost:8000/health',timeout=10);print(r.read().decode())" 2>/dev/null || echo '{}')
                STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
                MIGR=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('migration_ok','N/A'))" 2>/dev/null || echo "N/A")
                DB=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('db','N/A'))" 2>/dev/null || echo "N/A")
                SVC_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('service','unknown'))" 2>/dev/null || echo "unknown")
                # Determine expected service name for image-swap detection
                case "$LABEL" in
                  ma) EXPECTED_SVC="deal-mgmt" ;;
                  *) EXPECTED_SVC="$LABEL" ;;
                esac

                # PASS: correct service identity + responding + migration OK
                # WARN: db=error (service running but DB unreachable)
                # FAIL: wrong service name (image swap) / not responding / migration failed
                if [ "$STATUS" != "unknown" ] && [ "$SVC_NAME" = "$EXPECTED_SVC" ] && [ "$MIGR" != "False" ]; then
                  if [ "$DB" = "error" ]; then
                    echo "    $LABEL: OK (status=$STATUS, db=$DB ⚠, migration=$MIGR, service=$SVC_NAME)"
                  else
                    echo "    $LABEL: OK (status=$STATUS, db=$DB, migration=$MIGR, service=$SVC_NAME)"
                  fi
                else
                  echo "    $LABEL: FAILED (status=$STATUS, db=$DB, migration=$MIGR, service=$SVC_NAME)"
                  echo "    DEBUG[$LABEL]: raw='$RESPONSE'"
                  $COMPOSE logs "$SVC" --tail=10 2>/dev/null | head -15 || true
                  HEALTH_OK=false
                fi
              done

              # Frontend check (via nginx → frontend upstream)
              if $COMPOSE exec -T nginx wget -qO/dev/null --timeout=10 http://frontend:80/ 2>/dev/null; then
                echo "    frontend: OK"
              else
                echo "    frontend: FAILED"
                HEALTH_OK=false
              fi

              if [ "$HEALTH_OK" = true ]; then
                echo "  All checks passed on attempt $ATTEMPT"
                break
              elif [ "$ATTEMPT" -lt 3 ]; then
                echo "  Some checks failed, retrying..."
              fi
            done

            if [ "$HEALTH_OK" = false ]; then
              echo ""
              echo "!!! HEALTH CHECK FAILED after 3 attempts — Rolling back to $PREV_COMMIT !!!"
              git checkout "$BRANCH"
              git reset --hard "$PREV_COMMIT"
              $COMPOSE build $SERVICES
              $COMPOSE up -d $SERVICES
              echo "Rollback complete"
              exit 1
            fi

            # ── 7. Stability re-check (catch post-startup crashes) ──
            echo "=== [7/8] Stability Check (30s wait) ==="
            sleep 30
            STABLE=true
            for svc_ep in "fdd-api fdd" "kiis-api kiis" "im-api im" "deal-mgmt-api ma"; do
              SVC=$(echo "$svc_ep" | cut -d' ' -f1)
              LABEL=$(echo "$svc_ep" | cut -d' ' -f2)
              RESPONSE=$($COMPOSE exec -T "$SVC" python3 -c "import urllib.request as u,sys;r=u.urlopen('http://localhost:8000/health',timeout=10);print(r.read().decode())" 2>/dev/null || echo '{}')
              STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "ok" ]; then
                echo "    $LABEL: STABLE"
              else
                echo "    $LABEL: CRASHED (status=$STATUS)"
                STABLE=false
              fi
            done

            # ── 8. Container logs (always capture for debugging) ──
            echo "=== [8/8] Container Logs ==="
            echo "--- docker stats (snapshot) ---"
            docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>/dev/null || true
            echo ""
            for SVC in fdd-api kiis-api im-api deal-mgmt-api nginx frontend; do
              echo "--- $SVC (last 30 lines) ---"
              $COMPOSE logs --tail=30 "$SVC" 2>&1 || true
              echo ""
            done

            if [ "$STABLE" = false ]; then
              echo ""
              echo "WARNING: Some services crashed after initial health check."
              echo "Check container logs above for details."
              echo "Attempting restart of failed services..."
              $COMPOSE up -d $SERVICES
              sleep 15
            fi

            # Post-deploy diagnostic
            if [ -f scripts/diagnose-production.sh ]; then
              bash scripts/diagnose-production.sh --ci || echo "WARN: Diagnostic reported issues (see above)"
            fi

            echo ""
            echo "=== Deployment complete ==="
