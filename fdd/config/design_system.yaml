# Big 4 Style Design System (KPMG 기반)
# FDD 보고서 시각적 일관성을 위한 중앙 집중 설정
# 딜별 브랜딩 교체 시 이 파일만 복사하여 수정
version: "1.0"

# ============================================================
# 색상 팔레트
# ============================================================
colors:
  # 주요 브랜드 색상
  primary: "#003366"        # Navy Blue - 메인 타이틀, 헤더 배경
  secondary: "#0066CC"      # Medium Blue - 강조, 링크
  accent: "#0091DA"         # Light Blue - 아이콘, 하이라이트

  # 의미 기반 색상 (재무 데이터)
  positive: "#2E7D32"       # Green - add-backs, 긍정 지표, 증가
  negative: "#E0301E"       # Red - deductions, 리스크, 감소
  neutral: "#666666"        # Gray - 본문 텍스트, 부가정보
  warning: "#F9A825"        # Amber - 주의 필요 항목

  # 테이블 스타일
  header_bg: "#003366"      # 테이블 헤더 배경
  header_text: "#FFFFFF"    # 테이블 헤더 텍스트
  alt_row: "#F5F5F5"        # Zebra stripe (짝수 행 배경)
  border: "#CCCCCC"         # 테이블 테두리

  # 슬라이드/페이지 배경
  background: "#FFFFFF"     # 메인 배경
  cover_bg: "#003366"       # 표지 슬라이드 배경

# ============================================================
# 폰트 설정
# ============================================================
fonts:
  # 영어 텍스트 - 가독성 최고, 업계 표준
  english: "Inter"
  english_weight: "Regular"

  # 숫자/데이터 - 고정폭, 표 정렬 완벽
  data: "IBM Plex Mono"
  data_weight: "Regular"

  # 한글 텍스트 - 가장 모던하고 세련됨
  korean: "Pretendard"
  korean_weight: "Regular"

  # 특수문자 - 지원 문자 수 세계 최다
  special: "Noto Sans KR"
  special_weight: "Regular"

  # 제목/헤딩 (한글 기본)
  heading: "Pretendard"
  heading_weight: "Bold"

  # 본문 (한글 기본)
  body: "Pretendard"
  body_weight: "Regular"

  # 폰트 미설치 환경 대체
  fallback_english: "Arial"
  fallback_korean: "맑은 고딕"
  fallback_data: "Consolas"

# ============================================================
# 폰트 크기 (단위: pt)
# ============================================================
sizes:
  # PPT 슬라이드
  slide_title: 28
  section_title: 24
  body: 14
  table_header: 11
  table_body: 10
  footnote: 8
  kpi_callout: 60           # 대형 숫자 콜아웃

  # Word 문서
  doc_title: 18
  doc_heading1: 16
  doc_heading2: 14
  doc_heading3: 12
  doc_body: 11
  doc_caption: 9

# ============================================================
# 숫자 포맷
# ============================================================
number_formats:
  # 통화 (음수는 괄호)
  currency: "#,##0;(#,##0);-"
  currency_decimal: "#,##0.00;(#,##0.00);-"

  # 백분율
  percentage: "0.0%"
  percentage_precise: "0.00%"

  # 배수 (Multiple)
  multiple: "0.0x"

  # 일반 숫자
  integer: "#,##0"
  decimal: "#,##0.00"

# ============================================================
# 레이아웃 설정
# ============================================================
layout:
  # PPT 슬라이드
  aspect_ratio: "16:9"
  slide_width: 10.0         # 인치
  slide_height: 5.625       # 인치 (16:9)
  margin_left: 0.5
  margin_right: 0.5
  margin_top: 0.3
  margin_bottom: 0.3
  content_width: 9.0        # slide_width - margins

  # Word 문서 (A4)
  page_width: 8.27          # 인치 (210mm)
  page_height: 11.69        # 인치 (297mm)
  doc_margin_top: 1.0
  doc_margin_bottom: 1.0
  doc_margin_left: 1.25
  doc_margin_right: 1.0

# ============================================================
# 차트 스타일
# ============================================================
charts:
  # 워터폴 차트 (EBITDA Bridge 등)
  waterfall:
    increasing_color: "#2E7D32"   # positive
    decreasing_color: "#E0301E"   # negative
    total_color: "#003366"        # primary
    connector_color: "#666666"
    connector_dash: "dot"

  # 막대 차트
  bar:
    primary_color: "#003366"
    secondary_color: "#0066CC"
    accent_color: "#0091DA"

  # 선 차트
  line:
    primary_color: "#003366"
    line_width: 2
    marker_size: 6

  # 공통 설정
  common:
    background: "white"
    grid_color: "#E0E0E0"
    font_family: "Pretendard"
    font_family_data: "IBM Plex Mono"
    title_size: 14
    label_size: 10
    legend_size: 10

# ============================================================
# FDD 특화 설정
# ============================================================
fdd:
  # 조정 항목 카테고리별 색상
  adjustment_colors:
    one_off: "#FFA726"            # Orange - 일회성
    non_operating: "#7E57C2"      # Purple - 비영업
    run_rate: "#26A69A"           # Teal - Run-rate
    normalization: "#42A5F5"      # Light Blue - 정상화
    pro_forma: "#EC407A"          # Pink - Pro-forma

  # 리스크 등급별 색상
  risk_colors:
    high: "#E0301E"               # Red
    medium: "#F9A825"             # Amber
    low: "#2E7D32"                # Green

  # 신뢰도 표시 임계값
  confidence_thresholds:
    high: 0.8
    medium: 0.5
    low: 0.3                      # 이하는 표시 안함

# ============================================================
# 메타데이터
# ============================================================
metadata:
  author: "Auto FDD System"
  company: "Financial Due Diligence Team"
  confidentiality: "CONFIDENTIAL"
  copyright: "All Rights Reserved"
