[project]
name = "auto-fdd-backend"
version = "0.15.0"
description = "Financial Due Diligence Automation Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.5",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "plotly>=5.18.0",
    "kaleido>=1.0.0",
    "python-docx>=1.1.0",
    "docxtpl>=0.16.0",
    "python-pptx>=1.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.2.0",
    "slowapi>=0.1.9",
    # Multi-LLM (Sprint 14)
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Sprint 15 — Testcontainers
    "testcontainers[postgres]>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ──────────────────────────────────────────────
# Black
# ──────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py312"]

# ──────────────────────────────────────────────
# Ruff
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (Black handles)
    "B008",   # Depends() in function defaults — FastAPI pattern
    "B904",   # raise-without-from — gradual migration
    "RUF001", # ambiguous unicode char in string — intentional Korean text
    "RUF002", # ambiguous unicode char in docstring — intentional Korean text
    "RUF003", # ambiguous unicode char in comment — intentional Korean text
    "RUF012", # mutable-class-default — Pydantic models use mutable defaults by design
    "RUF059", # unused-unpacked-variable — intentional destructuring patterns
    "SIM102", # collapsible-if — intentional readability
    "SIM105", # suppressible-exception — try-except-pass intentional
    "SIM108", # if-else-block-instead-of-if-exp — readability first
    "UP042",  # StrEnum migration — keep str+Enum pattern for now
    "UP047",  # unnecessary backslash in f-string
    "B007",   # unused-loop-variable — intentional unpacking
    "B017",   # assert-raises-exception — test patterns
    "B023",   # function-uses-loop-variable — engine loop patterns
    "B905",   # zip-without-explicit-strict
    "E741",   # ambiguous-variable-name — mathematical notation
    "SIM113", # enumerate-for-loop
    "SIM118", # in-dict-keys — explicit .keys() preferred
    "RUF005", # collection-literal-concatenation
    "RUF015", # unnecessary-iterable-allocation-for-first-element
    "RUF017", # quadratic-list-summation
    "RUF022", # unsorted-dunder-all
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20", "N806", "F401", "F841", "B018", "E402"]
"app/templates/**/*.py" = ["T20"]
"scripts/*.py" = ["F821", "E402", "T20", "F401", "F841", "N806", "E741", "E722"]
"app/api/*.py" = ["E402", "N806"]
"app/engines/*.py" = ["F841", "N806"]
"app/renderers/*.py" = ["F841", "F401"]
"app/services/**/*.py" = ["F841", "F401"]
"app/qa/*.py" = ["F841"]
"app/ralph/generators/*.py" = ["N806"]

# ──────────────────────────────────────────────
# mypy — strict mode
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "alembic.*", "anthropic.*", "openai.*", "google.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────
# pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "db: tests requiring PostgreSQL via testcontainers (Docker required)",
    "unit: pure unit tests without DB dependency",
]
