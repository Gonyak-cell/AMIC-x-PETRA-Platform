# docker-compose.ssl.yml — SSL/TLS overlay for production
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
#
# Prerequisites:
#   1. Run ./scripts/setup-ssl.sh --self-signed --domain fdd.example.com
#      OR ./scripts/setup-ssl.sh --domain fdd.example.com --email admin@example.com
#   2. Certificates must exist in ./config/ssl/

services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/ssl/certs:/etc/ssl/certs:ro
      - ./config/ssl/private:/etc/ssl/private:ro
      - ./config/certbot/www:/var/www/certbot:ro
