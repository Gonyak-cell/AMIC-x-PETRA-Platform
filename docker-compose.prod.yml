# ============================================================
# AMIC x PETRA Platform — Production Docker Compose Override
# ============================================================
# 사용법: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 백엔드 포트(8000-8002)는 호스트에 노출하지 않음 (nginx 경유만 허용)
#
# JWT 시크릿: SHARED_JWT_SECRET 하나로 모든 백엔드 통일 (크로스 모듈 인증)
#
# SSL/도메인 추가 시: docker-compose.ssl.yml 오버레이 사용
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
# ============================================================

services:
  # ======================== FRONTEND ========================
  # Prod Dockerfile: multi-stage build → 내부 nginx(port 80)로 SPA 서빙
  # 외부 nginx가 이 컨테이너로 프록시 → SSL 종료 + API 라우팅
  frontend:
    build:
      context: ./amic-platform
      dockerfile: Dockerfile
    image: amic-frontend:latest
    ports: []
    volumes: []
    restart: unless-stopped

  # ======================== NGINX (production, HTTP only) ========================
  # SSL/도메인이 필요하면 docker-compose.ssl.yml 오버레이로 추가
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod-nossl.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ======================== FDD BACKEND ========================
  fdd-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql://autofdd:${FDD_DB_PASSWORD}@fdd-db:5432/autofdd
      PPTX_SERVICE_URL: http://fdd-pptx:3100
      CORS_ORIGINS: ${FDD_CORS_ORIGINS}
      JWT_SECRET: ${SHARED_JWT_SECRET}
      LOG_LEVEL: ${FDD_LOG_LEVEL:-INFO}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fdd-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${FDD_DB_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fdd-pptx:
    ports: []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # ======================== KIIS BACKEND ========================
  kiis-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql+asyncpg://kiis_user:${KIIS_DB_PASSWORD}@kiis-db:5432/kiis
      REDIS_URL: redis://:${KIIS_REDIS_PASSWORD:?KIIS_REDIS_PASSWORD 필수}@kiis-redis:6379/0
      ELASTICSEARCH_URL: http://elastic:${KIIS_ES_PASSWORD:?KIIS_ES_PASSWORD 필수}@kiis-es:9200
      ALLOWED_ORIGINS: ${KIIS_CORS_ORIGINS}
      SECRET_KEY: ${SHARED_JWT_SECRET}
      JWT_SECRET: ${SHARED_JWT_SECRET}
      WORKERS: 4
      LOG_LEVEL: ${KIIS_LOG_LEVEL:-WARNING}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kiis-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${KIIS_DB_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kiis-redis:
    ports: []
    command:
      - redis-server
      - --requirepass
      - ${KIIS_REDIS_PASSWORD:?KIIS_REDIS_PASSWORD 필수}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  kiis-es:
    ports: []
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${KIIS_ES_PASSWORD:?KIIS_ES_PASSWORD 필수}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ======================== IM BACKEND ========================
  im-api:
    command: gunicorn -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 120 src.api.main:app
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${IM_DB_PASSWORD}@im-db:5432/imgen
      REDIS_URL: redis://:${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}@im-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}@im-redis:6379/1
      CORS_ORIGINS: ${IM_CORS_ORIGINS}
      SECRET_KEY: ${SHARED_JWT_SECRET}
      JWT_SECRET: ${SHARED_JWT_SECRET}
      DEBUG: "false"
      LOG_LEVEL: ${IM_LOG_LEVEL:-WARNING}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  im-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${IM_DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  im-redis:
    ports: []
    command:
      - redis-server
      - --requirepass
      - ${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --appendonly
      - "yes"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  im-celery-worker:
    command: >
      celery -A src.api.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --time-limit=3600
      --soft-time-limit=3300
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${IM_DB_PASSWORD}@im-db:5432/imgen
      REDIS_URL: redis://:${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}@im-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}@im-redis:6379/1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ======================== DEAL MANAGEMENT BACKEND ========================
  deal-mgmt-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql+asyncpg://deal_mgmt_user:${MA_DB_PASSWORD}@deal-mgmt-db:5432/deal_mgmt
      REDIS_URL: redis://:${MA_REDIS_PASSWORD:?MA_REDIS_PASSWORD 필수}@deal-mgmt-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${MA_REDIS_PASSWORD:?MA_REDIS_PASSWORD 필수}@deal-mgmt-redis:6379/1
      JWT_SECRET: ${SHARED_JWT_SECRET}
      ALLOWED_ORIGINS: ${MA_CORS_ORIGINS}
      FDD_API_URL: http://fdd-api:8000/api/v1
      IM_API_URL: http://im-api:8000/api
      KIIS_API_URL: http://kiis-api:8000/api/v1
      CLOVA_CLIENT_ID: ${CLOVA_CLIENT_ID}
      CLOVA_CLIENT_SECRET: ${CLOVA_CLIENT_SECRET}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_VDR_CONTAINER_NAME: ${AZURE_VDR_CONTAINER_NAME:-amic-vdr}
      DEBUG: "false"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deal-mgmt-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${MA_DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deal-mgmt-redis:
    ports: []
    command:
      - redis-server
      - --requirepass
      - ${MA_REDIS_PASSWORD:?MA_REDIS_PASSWORD 필수}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  deal-mgmt-celery-worker:
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-memory-per-child=250000
      --max-tasks-per-child=100
      --time-limit=3600
      --soft-time-limit=3300
    volumes: []
    environment:
      DATABASE_URL: postgresql+asyncpg://deal_mgmt_user:${MA_DB_PASSWORD}@deal-mgmt-db:5432/deal_mgmt
      REDIS_URL: redis://:${MA_REDIS_PASSWORD:?MA_REDIS_PASSWORD 필수}@deal-mgmt-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${MA_REDIS_PASSWORD:?MA_REDIS_PASSWORD 필수}@deal-mgmt-redis:6379/1
      JWT_SECRET: ${SHARED_JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_VDR_CONTAINER_NAME: ${AZURE_VDR_CONTAINER_NAME:-amic-vdr}
      CELERY_WORKER: "1"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deal-mgmt-celery-beat:
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://deal_mgmt_user:${MA_DB_PASSWORD}@deal-mgmt-db:5432/deal_mgmt
      REDIS_URL: redis://:${MA_REDIS_PASSWORD:?MA_REDIS_PASSWORD 필수}@deal-mgmt-redis:6379/0
      CELERY_WORKER: "1"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  im-celery-beat:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${IM_DB_PASSWORD}@im-db:5432/imgen
      REDIS_URL: redis://:${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}@im-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${IM_REDIS_PASSWORD:?IM_REDIS_PASSWORD 필수}@im-redis:6379/1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  certbot-www:
