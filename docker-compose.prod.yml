# ============================================================
# AMIC x PETRA Platform — Production Docker Compose Override
# ============================================================
# 사용법: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 백엔드 포트(8000-8002)는 호스트에 노출하지 않음 (nginx 경유만 허용)
#
# SSL/도메인 추가 시: docker-compose.ssl.yml 오버레이 사용
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
# ============================================================

services:
  # ======================== FRONTEND ========================
  # Prod Dockerfile: multi-stage build → 내부 nginx(port 80)로 SPA 서빙
  # 외부 nginx가 이 컨테이너로 프록시 → SSL 종료 + API 라우팅
  frontend:
    build:
      context: ./amic-platform
      dockerfile: Dockerfile
    ports: []
    volumes: []
    restart: unless-stopped

  # ======================== NGINX (production, HTTP only) ========================
  # SSL/도메인이 필요하면 docker-compose.ssl.yml 오버레이로 추가
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod-nossl.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ======================== FDD BACKEND ========================
  fdd-api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql://autofdd:${FDD_DB_PASSWORD}@fdd-db:5432/autofdd
      PPTX_SERVICE_URL: http://fdd-pptx:3100
      CORS_ORIGINS: ${FDD_CORS_ORIGINS}
      JWT_SECRET: ${FDD_JWT_SECRET}
      LOG_LEVEL: ${FDD_LOG_LEVEL:-INFO}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fdd-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${FDD_DB_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fdd-pptx:
    ports: []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # ======================== KIIS BACKEND ========================
  kiis-api:
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql+asyncpg://kiis_user:${KIIS_DB_PASSWORD}@kiis-db:5432/kiis
      REDIS_URL: redis://:${KIIS_REDIS_PASSWORD:-redis}@kiis-redis:6379/0
      ELASTICSEARCH_URL: http://elastic:${KIIS_ES_PASSWORD:-changeme}@kiis-es:9200
      CORS_ORIGINS: ${KIIS_CORS_ORIGINS}
      SECRET_KEY: ${KIIS_SECRET_KEY}
      WORKERS: 4
      LOG_LEVEL: ${KIIS_LOG_LEVEL:-WARNING}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kiis-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${KIIS_DB_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kiis-redis:
    ports: []
    command:
      - redis-server
      - --requirepass
      - ${KIIS_REDIS_PASSWORD:-redis}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  kiis-es:
    ports: []
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${KIIS_ES_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ======================== IM BACKEND ========================
  im-api:
    command: gunicorn -c gunicorn.conf.py src.api.main:app
    ports: []
    volumes: []
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${IM_DB_PASSWORD}@im-db:5432/imgen
      REDIS_URL: redis://:${IM_REDIS_PASSWORD:-redis}@im-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${IM_REDIS_PASSWORD:-redis}@im-redis:6379/1
      CORS_ORIGINS: ${IM_CORS_ORIGINS}
      SECRET_KEY: ${IM_SECRET_KEY}
      DEBUG: "false"
      LOG_LEVEL: ${IM_LOG_LEVEL:-WARNING}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  im-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${IM_DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  im-redis:
    ports: []
    command:
      - redis-server
      - --requirepass
      - ${IM_REDIS_PASSWORD:-redis}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --appendonly
      - "yes"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  im-celery-worker:
    command: >
      celery -A src.api.tasks.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=100
      --time-limit=3600
      --soft-time-limit=3300
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${IM_DB_PASSWORD}@im-db:5432/imgen
      REDIS_URL: redis://:${IM_REDIS_PASSWORD:-redis}@im-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${IM_REDIS_PASSWORD:-redis}@im-redis:6379/1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  im-celery-beat:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${IM_DB_PASSWORD}@im-db:5432/imgen
      REDIS_URL: redis://:${IM_REDIS_PASSWORD:-redis}@im-redis:6379/0
      REDIS_RESULT_BACKEND: redis://:${IM_REDIS_PASSWORD:-redis}@im-redis:6379/1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
