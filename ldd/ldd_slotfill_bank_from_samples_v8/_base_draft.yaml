      넘는 무한 커렌츠 제작 투자 건 또는() 대상회사 또는 그 계열회사가 제작 또 책임올 민사상 부담하는 경우가 문제월 수 있율 것으로 보이튿데
      , 대상회사 논 제작사로 참여하는 본렌츠 제작 투자 건 중 조합이 투자하는 건 논 자금보중악정으로 해당 조함과 관련하여 발생합 수 있는
      사업상의 손해 에 대해서 조합의 투자원금의 합계액보다 조합이 하당 대상 투자 (투자금 미회수액) 드 모두 부담하고 있으므로 추가적인 책임올
      부담합 가능 건들로부터 회수하없거나 조함의 존속기간 만로일까지 회수가 확정 성은 크지 않울 것으로 보임(이와 관련하여 세무적인 영합이 있물지는
      별도 팀 금역이 부족한 경우 그 부족금액올 조합에 지급하기로 하없올 검토 필요) 한편 , 영화사월광 및 사나이관처스는 2021 년 6 월
      30 일자로 대상회 한편 긍정거래법은 사업자가 특수관계인 또는 다른 회사어 가지급금 , 대여 사메게 자금보종수스로로 조합의 투자 금역 중
      대상회사의 투자 금 통올제공하거나 상당히 유리한 조건으로 거래하는 행위늄 부당 지원행 금액올 제외한 나머지 금액의 0206(VAT 별도)에
      해당하는 금액올 수 위로서 금지하고 있음 이와 관련하여 대상회사가 투자조함과 체결한 무자 스로로 지급한다는 내용의 자금보증수스로 계약서들
      대상회사와 체 손실 분에 대한 자금보중악정올 정상적인 시장관행으로 봄 수 없고 모회사 결함 의 자금보중약정이 없없더라면 자회사의 투자급
      유치가 사실상 어려윗움 것이라는 점이 인정되다면 자회사에 투자손실 부담액 상당액의 경제상 부료 제공한 것으로 여지가 있으므로 부분에 대하여
      대상회사의 회사에 대한 부탕지원행워가 인정되 리스크틈 완전히 바제하기는 어려움 다만 제공된 자료데 의하면 , 대상회사는 위 구조에 대하여
