- id: base_25
  normalized_text: 이후 공정위가 {{CASE_NO}} 일에 소명은 요청합어 따라 대상회사는 가령점수수로름 신용카드 회원에게 전가하는
    것은 금지되고 이급 위반한 환불수수로가 워악금에 해당학 뿐 여신전문금움업범상 회원(소비자) 자능 1 년 이하의 징역 또는 {{AMOUNT}}
    이하의 벌금형에 처해질 수 있음 예제 전가가 불가능한 "가땅점수수로"에 해당하지는 않듣다는 점, 곁 따라서 지속적인 모니터팅은 필요하다 대상회사의
    소망의견 및 공정위의 제방 법죄 구분하지 암고 모든 회원에계 동일하게 부과되고 있는 점, 과거 선레 표준약관의 내용에 비추어 카카오페이지의
    환문에 관한 약관내 위악금의 수준은 긍정위에서 발표한 온라인게임 표준약관 및 이전 용이 고객에게 부당하게 불리한 약관으로 인정되 가능성은 일응
    높지 양울 선레에 비추어 보더라도 고객에게 부당하지 불리하다고 봄 수 없는 것으로 판단팀 또한 환불수수로는 결제방 번에 따라 회원올 달리 취급하고
    점 둥올 근거로 약관규제법 및 여신전문금움업법 위반이 아니라는 있지 않으무로 여신전문금용업법 위반에 해당학 가능성 역시 높지 암음 것 취지의
    소명의견물 제출하없음 으로 보임 아울러 공정위에서도 이메일로 약식의 소명 요청울 한 이후 별 이후 긍정위 또는 금움위 등 여신전문금움업법 관련
    규제기관의 추 도의 추가 조치가 없없다는 점데서도 긍정위 내지 금움위 등의 조사 개시 가 요청 등은 없엿던 것으로 보임 가능성이 높아 보이지는
    않음
