  normalized_text: 사용자는 비정규직임을 이유로 사업 내의 같은 종류의 업무 또는 유사한 업무를 수행하는 정규직에 비하여 차별적 처우를
    하여서는 아니되고, 이러한 차별적 처우에는 임금 및 복리후생 등 근로조건에 관한 사항이 포함됨. 차별적 처우를 받은 비정규직 근로자는 노동위원회에
    시정을 신청할 수 있고, 노동위원회는 시정명령과 함께 손해액을 기준으로 3배를 넘지 아니하는 범위에서 배상을 명령할 수 있음. 다만, 사업주는
    고령자인 정년퇴직자를 재고용할 때 당사자 간의 합의에 의하여 퇴직금과 연차휴가일수 계산을 위한 계속근로기간을 산정할 때 종전의 근로기간을 제외할
    수 있으며 임금의 결정을 종전과 달리할 수 있음. 대상회사의 비정규직 중에는 정년을 도과한 기간제 근로자 이외에도 정규직과 동일하거나 유사한
    생산보조 업무를 수행하면서 정규직에 비하여 낮은 근로조건을 적용 받는 파견근로자들이 존재함. 이에 만약 해당 비정규직들이 노동위원회에 차별시정
    신청을 하는 경우 대상회사는 노동위원회로부터 최대 최근 3년간 정규직과의 근로조건 차이에 따라 비정규직에게 발생한 손해액의 3배에 해당하는
    액수에 대한 배상 명령을 받을 가능성이 있음. 대상회사의 생산보조 업무를 수행하는 파견근로자들에 대한 차별적 처우로 인하여 발생할 수 있는
    금전적 영향은 약 {{AMOUNT}}으로 추산됨.
