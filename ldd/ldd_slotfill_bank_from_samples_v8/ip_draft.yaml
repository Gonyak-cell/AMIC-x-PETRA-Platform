    소송 또는 분쟁이 발생할 가능성을 배제할 수 없습니다. 그리고 이와 같은 소송 또는 분쟁이 추후 대상회사의 경영 및 영업활동, 핵심기술 등과
    관련하여 중요한 영향을 미칠 가능성 또한 적지 않다고 할 것입니다. 대상회사는 현재 상장예비심사청구 전에 직무발명보상규정을 제정하기 위하여
    내부 논의를 거쳐 조항을 정비하고 있으며, 직무발명보상규정 제정 이후에는 발명자에 대하여 시행일로부터 적절한 보상을 할 것을 계획하고 있어,
    추후 소송 또는 분쟁이 발생하지 않을 만한 적절한 대응방안을 준비하여 추진 중인 것으로 보입니다.
