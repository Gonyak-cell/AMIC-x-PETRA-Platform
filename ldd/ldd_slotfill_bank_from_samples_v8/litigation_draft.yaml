    상장(이하 “본건 상장”)하는 것과 관련하여, 대상회사가 본건 상장을 완료하기 위하여 상장 요건을 충족하고 있는지를 파악하고, 상장예비심사청구서
    및 증권신고서에 기재될 대상회사에 관한 주요한 법률적인 사항을 확인하여 상장 주관회사가 본건 상장 업무를 원활하게 진행할 수 있도록 하는 데에
    목적이 있습니다. 저희는 본건 실사 과정에서 모든 문제점을 망라적으로 검토하기보다는 중요한 이슈 위주로 제한된 범위 내에서 검토를 실시하였고,
    본 보고서에도 그러한 주요 이슈만이 반영되어 있습니다. 또한 저희는 가정적인 상황에 기초하여 관련된 위험요소를 파악하려고 의도하지는 아니하였습니다.
