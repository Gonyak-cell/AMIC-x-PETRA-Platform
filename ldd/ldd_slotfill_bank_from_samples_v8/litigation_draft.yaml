    저희 사무소는 2018년 1월 9일부터 본 실사보고서의 작성일까지 1 e-mail을 통해 파일로 제공된 서류들의 검토, 2 회사의 임원 및
    실무진 면담, 3 서면 및 구두 추가 질의 및 그에 대한 답변 수령 절차를 통하여 회사 및 그 종속회사들에 대한 법률실사(“본건 실사”)를
    실시하였습니다. 본건 실사의 목적은 본건 거래와 관련하여 중요한 법률적 영향을 가질 수 있는 사항으로서 고려할 필요가 있는 사항들을 파악,
    확인 및 분석하는 것이었으며, 저희는 본건 실사 과정에서 모든 문제점을 망라적으로 검토하기보다는 중요한 이슈 위주로 제한된 범위 내에서 검토를
    실시하였고, 본 실사보고서에도 그러한 주요 이슈만이 반영되어 있습니다. 또한 저희는 가정적인 상황에 기초하여 관련된 위험요소를 파악하려고 의도하지는
    아니하였습니다. 본 실사보고서는 회사의 일반사항, 인허가 및 공정거래를 포함한 규제사항, 영업 및 재무 관련 중요 계약, 부동산, 인사 및
    노무, 지식재산권, 소송 기타 분쟁, 보험에 관한 법률적 사항들만을 그 대상으로 하였으며, 수익성, 사업계획, 마케팅, 연구개발, 회계 및
    세무, 기업문화 및 관행 등은 법률실사의 대상이 되지 아니하였습니다.'
