      권한을 포함한다)을 위임한 자(해당 위임분만 해당한다)(이하 총칭하여 “특수관계인 등”)가 소유하는 주식을 합산하여 3%를 초과하는 주식에
      대한 의결권을 행사할 수 없음(상법 제542조의12).
