- id: governance_25
  normalized_text: 위 두 단계 결의 중에서 두번째 (ii)의 감사위원 선임 결의시, 주주별로 의결권 없는 주식을 제외한 발행주식 총수의
    {{PERCENT}}를 초과하는 주식에 대하여 의결권 행사가 제한됨. 특히, 사외이사가 아닌 감사위원을 선임할 경우 최대주주는 (i) 최대주주의
    특수관계인, (ii) 최대주주 또는 그 특수관계인의 계산으로 주식을 보유하는 자 및 (iii) 최대주주 또는 그 특수관계인에게 의결권(의결권의
    행사를 지시할 수 있는 권한을 포함한다)을 위임한 자(해당 위임분만 해당한다)(이하 총칭하여 “특수관계인 등”)가 소유하는 주식을 합산하여
    {{PERCENT}}를 초과하는 주식에 대한 의결권을 행사할 수 없음(상법 제542조의12).
