      자산의 처분에 해당하는가 아닌가는 당해 재산의 가액, 총자산에서 차지하는 비율, 회사의 규모, 회사의 영업 또는 재산의 상황, 경영상태,
      자산의 보유목적, 회사의 일상적 업무와의 관련성, 당해 회사에서의 종래의 취급 등에 비추어 대표이사의 결정에 맡기는 것이 상당한지 여부에
      따라 판단하여야 할 것이고, 중요한 자산의 처분에 해당하는 경우에는 이사회가 그에 관하여 직접 결의하지 아니한 채 대표이사에게 그 처분에
      관한 사항을 일임할 수 없는 것”이라고 판시하고 있음(대법원 2005. 7. 28. 선고 2005다3649 판결).
- id: governance_24
  normalized_text: 한편, 상법상 자격요건을 갖춘 사외이사를 선임하고 이사회의 사외이사 구성요건을 충족하는 것은 상장기업의 지배구조요건을
    충족하는 사항으로서 미달 시 관리종목에 지정될 수 있는 사항인 만큼 상장유지조건으로도 중요한 사항입니다. 즉, 거래소는 상장예비심사시 사외이사의
    상법상 자격요건을 충족하는지에 대해 상장신청인과 대표주관회사가 제출하는 “사외이사 자격요건 확인서”를 통해 확인하고 있으며, 필요한 경우 해당
    사외이사의 이력서를 제출 받고 있습니다. 사외이사 선임시 해당 이사가 자격요건을 잘못 이해하여 자격 미달의 사외이사가 선임되는 경우도 발생하므로,
    대상회사로 하여금 사외이사의 자격심사를 꼼꼼히 진행하도록 할 필요가 있을 것으로 사료됩니다.
