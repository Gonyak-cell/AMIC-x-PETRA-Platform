  normalized_text: 답변에 의하면, 청탁금지법 관련해서는, 기본적으로 회사의 할인은 임원 할인 제도를 통해서 제공되는데, 문제된 임원이
    지인인 언론인, 공직자 등을 상대로 할인 혜택을 제공하여 문제가 된 것이라고 함. 임원 할인 제도를 통해 할인혜택을 제공할 때에는 개별 품의를
    통해서 승인을 받고 진행을 하며, 할인 대상자가 김영란법 적용대상자가 아니라는 “김영란법 미적용확인서”를 해당 임원으로부터 받고 있다고 함.
    문제가 된 사례들에서 해당 임원인 A 상무는 김영란법 미적용 확인서를 작성, 서명하여 제출하였다고 함. 인터뷰에 따르면, 회사가 청탁금지법
    관련 교육을 실시하였다고는 하나, 해당 임직원들이 지인인 공직자, 언론인 등에게 할인혜택을 제공하기 위하여 품의서를 결재받는 과정에서 혜택
    부여 대상의 직업을 기재하도록 요구하고 있지 않아 결재과정에서 언론인, 공직자 등에 대한 확인이 어렵다고 함.
