- id: data_it_20
  normalized_text: 한편, 수집한 개인정보가 불필요해진 경우 개인정보보호법 제21조에 따라 지체 없이 복구 불가능한 방법으로 파기해야
    하고, 개인정보가 불필요하게 되었음에도 지체 없이 그 개인정보를 파기하지 않은 경우 3천만원의 과태료를 부과 받을 수 있습니다(개인정보보호법
    제75조 제2항 {{REF_NO}}). 위 ‘개인정보 활용 동의서’에 의하면, 회사는 채용 과정에서 입사지원자로부터 수집한 위 정보를 수집일로부터
    12개월 동안 위 이용 목적을 위해 보유·이용하는 것으로 기재하고 있습니다. 직원으로 채용되지 않은 입사지원자의 경우 동의서에 기재된 위 이용
