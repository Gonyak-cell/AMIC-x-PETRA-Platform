    heading: 2014. 4. 16. | (약) 제2014-081호 | 표시광고법상 부당한광고행위 (거짓과장 및 비방광고) | 시정명령 >
      인터넷 홈페이지 및 모바일 회원 가입 시 개인정보 수집 및 이용동의
    text: 회사는 마케팅/홍보 목적의 개인정보 이용동의를 필수적 동의사항으로 간주하여 동의를 받고 있음. 따라서, 영리목적의 광고성 정보 전송에
      관한 동의는 선택동의로 받도록 수정할 필요가 있음. 원칙적으로 이는 필수적 동의대상과 구별하여 별개의 선택적 동의사항을 선택할 수 있도록
      할 필요가 있음. 대안으로서 마케팅/홍보를 위한 개인정보 수집 및 이용 동의와 함께 위와 같은 동의를 일괄하여 받는 것도 고려할 수 있을
      것이나, 이러한 경우에도 방통위는 ‘광고성 정보 수신’이라는 표현이 명시적으로 포함되어야 한다는 입장인 점을 고려할 때, ‘이용약관 동의’
      부분에 기재된 관련 내용을 삭제하고 ‘부가 정보’ 부분에 해당 표현을 기재할 필요가 있을 것임. 개인정보 보호법상 필수동의와 선택동의를
      구분하지 않고 동의를 받을 경우 1천만원 이하의 과태료가 부과될 있음(위 “III. 2. 파트너사와의 계약 (상품매입계약)” 참조).
