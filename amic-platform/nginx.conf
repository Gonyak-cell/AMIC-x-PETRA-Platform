# AMIC x PETRA Platform — Frontend SPA Nginx Configuration
# 프론트엔드 컨테이너 내부 nginx: SPA 라우팅 + 정적 에셋 캐싱

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 해시 에셋 (*.js, *.css 등) — 영구 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 정적 리소스 (이미지, 폰트 등)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — 모든 라우트를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
