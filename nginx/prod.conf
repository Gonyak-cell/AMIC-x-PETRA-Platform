# AMIC x PETRA Platform — Production Nginx Configuration
# SSL/TLS termination + frontend proxy + 3 backend API proxy

# Frontend container (내부 nginx가 SPA 서빙, port 80)
upstream frontend {
    server frontend:80;
}

upstream fdd_api {
    server fdd-api:8000;
}

upstream kiis_api {
    server kiis-api:8000;
}

upstream im_api {
    server im-api:8000;
}

# ====================================================================
# HTTP → HTTPS redirect
# ====================================================================
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================================================================
# HTTPS server
# ====================================================================
server {
    listen 443 ssl http2;
    server_name _;

    # ------------------------------------------------------------------
    # SSL/TLS
    # TODO: 'platform.example.com'을 실제 도메인으로 변경하세요
    # ------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/platform.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.example.com/privkey.pem;

    # Mozilla Intermediate
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ------------------------------------------------------------------
    # Frontend — proxy to frontend container (내부 nginx가 SPA + 캐싱 처리)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # FDD Backend API — /api/fdd/* → fdd-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/fdd/ {
        rewrite ^/api/fdd/(.*)$ /api/v1/$1 break;
        proxy_pass http://fdd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # KIIS Backend API — /api/kiis/* → kiis-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/kiis/ {
        rewrite ^/api/kiis/(.*)$ /api/v1/$1 break;
        proxy_pass http://kiis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # IM Backend API — /api/im/* → im-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/im/ {
        rewrite ^/api/im/(.*)$ /api/v1/$1 break;
        proxy_pass http://im_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Health check endpoints (internal only)
    # ------------------------------------------------------------------
    location /health/fdd {
        internal;
        proxy_pass http://fdd_api/health;
    }

    location /health/kiis {
        internal;
        proxy_pass http://kiis_api/health;
    }

    location /health/im {
        internal;
        proxy_pass http://im_api/health;
    }
}
