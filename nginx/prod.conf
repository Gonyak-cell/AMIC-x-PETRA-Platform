# AMIC x PETRA Platform — Production Nginx Configuration
# SSL/TLS termination + frontend proxy + 4 backend API proxy

# Frontend container (내부 nginx가 SPA 서빙, port 80)
upstream frontend {
    server frontend:80;
}

upstream fdd_api {
    server fdd-api:8000;
}

upstream kiis_api {
    server kiis-api:8000;
}

upstream im_api {
    server im-api:8000;
}

upstream deal_mgmt_api {
    server deal-mgmt-api:8000;
}

# ====================================================================
# HTTP → HTTPS redirect
# ====================================================================
server {
    listen 80;
    server_name ap-platform.kr www.ap-platform.kr;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ====================================================================
# HTTPS server
# ====================================================================
server {
    listen 443 ssl http2;
    server_name ap-platform.kr www.ap-platform.kr;

    # ------------------------------------------------------------------
    # SSL/TLS — Let's Encrypt (certbot)
    # ------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/ap-platform.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ap-platform.kr/privkey.pem;

    # Mozilla Intermediate
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://*.ingest.sentry.io;" always;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ------------------------------------------------------------------
    # Frontend — proxy to frontend container (내부 nginx가 SPA + 캐싱 처리)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # FDD Backend API — /api/fdd/* → fdd-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/fdd/ {
        rewrite ^/api/fdd/(.*)$ /api/v1/$1 break;
        proxy_pass http://fdd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # KIIS Backend API — /api/kiis/* → kiis-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/kiis/ {
        rewrite ^/api/kiis/(.*)$ /api/v1/$1 break;
        proxy_pass http://kiis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # IM Backend API — /api/im/* → im-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/im/ {
        rewrite ^/api/im/(.*)$ /api/v1/$1 break;
        proxy_pass http://im_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Deal Management API — SSE streaming (Q&A)
    # ------------------------------------------------------------------
    location ~ ^/api/ma/transactions/[^/]+/vdr/qa/stream$ {
        rewrite ^/api/ma/(.*)$ /api/v1/$1 break;
        proxy_pass http://deal_mgmt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        client_max_body_size 1M;
    }

    # ------------------------------------------------------------------
    # Deal Management API — /api/ma/* → deal-mgmt-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/ma/ {
        rewrite ^/api/ma/(.*)$ /api/v1/$1 break;
        proxy_pass http://deal_mgmt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Health check endpoints (외부 모니터링용 — UptimeRobot 등)
    # /api/{module}/health → backend /health
    # ------------------------------------------------------------------
    location = /api/fdd/health {
        proxy_pass http://fdd_api/health;
    }

    location = /api/kiis/health {
        proxy_pass http://kiis_api/health;
    }

    location = /api/im/health {
        proxy_pass http://im_api/health;
    }

    location = /api/ma/health {
        proxy_pass http://deal_mgmt_api/health;
    }
}
