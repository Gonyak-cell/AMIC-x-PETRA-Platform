# AMIC x PETRA Platform — Development Nginx Reverse Proxy
# 개발 환경에서 프론트엔드(Vite) + 3개 백엔드 API를 단일 포트(3000)로 통합

upstream frontend {
    server frontend:5173;
}

upstream fdd_api {
    server fdd-api:8000;
}

upstream kiis_api {
    server kiis-api:8000;
}

upstream im_api {
    server im-api:8000;
}

server {
    listen 80;
    server_name localhost;

    # ----------------------------------------------------------------
    # Frontend (Vite dev server)
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # FDD Backend API — /api/fdd/* → fdd-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/fdd/ {
        rewrite ^/api/fdd/(.*)$ /api/v1/$1 break;
        proxy_pass http://fdd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------------
    # KIIS Backend API — /api/kiis/* → kiis-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/kiis/ {
        rewrite ^/api/kiis/(.*)$ /api/v1/$1 break;
        proxy_pass http://kiis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # IM Backend API — /api/im/* → im-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/im/ {
        rewrite ^/api/im/(.*)$ /api/v1/$1 break;
        proxy_pass http://im_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }
}
