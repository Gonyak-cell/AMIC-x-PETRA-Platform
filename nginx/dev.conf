# AMIC x PETRA Platform — Development Nginx Reverse Proxy
# 개발 환경에서 프론트엔드(Vite) + 3개 백엔드 API를 단일 포트(3000)로 통합

upstream frontend {
    server frontend:5173;
}

upstream fdd_api {
    server fdd-api:8000;
}

upstream kiis_api {
    server kiis-api:8000;
}

upstream im_api {
    server im-api:8000;
}

upstream deal_mgmt_api {
    server deal-mgmt-api:8000;
}

server {
    listen 80;
    server_name localhost;

    # ----------------------------------------------------------------
    # Frontend (Vite dev server)
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------------
    # Health Check — /api/{module}/health → {module}-api:8000/health
    # health 엔드포인트는 /health (루트)에 위치하므로 별도 리라이트 필요
    # 범용 규칙보다 먼저 매칭되어야 함 (nginx longest prefix match)
    # ----------------------------------------------------------------
    location = /api/fdd/health {
        rewrite ^ /health break;
        proxy_pass http://fdd_api;
        proxy_set_header Host $host;
    }

    location = /api/kiis/health {
        rewrite ^ /health break;
        proxy_pass http://kiis_api;
        proxy_set_header Host $host;
    }

    location = /api/im/health {
        rewrite ^ /health break;
        proxy_pass http://im_api;
        proxy_set_header Host $host;
    }

    location = /api/ma/health {
        rewrite ^ /health break;
        proxy_pass http://deal_mgmt_api;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------------
    # FDD Backend API — /api/fdd/* → fdd-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/fdd/ {
        rewrite ^/api/fdd/(.*)$ /api/v1/$1 break;
        proxy_pass http://fdd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------------
    # KIIS Backend API — /api/kiis/* → kiis-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/kiis/ {
        rewrite ^/api/kiis/(.*)$ /api/v1/$1 break;
        proxy_pass http://kiis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ----------------------------------------------------------------
    # IM Backend API — /api/im/* → im-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/im/ {
        rewrite ^/api/im/(.*)$ /api/v1/$1 break;
        proxy_pass http://im_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------------
    # Deal Management API — /api/ma/* → deal-mgmt-api:8000/api/v1/*
    # ----------------------------------------------------------------
    location /api/ma/ {
        rewrite ^/api/ma/(.*)$ /api/v1/$1 break;
        proxy_pass http://deal_mgmt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
