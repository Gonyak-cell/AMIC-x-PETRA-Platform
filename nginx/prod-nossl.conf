# AMIC x PETRA Platform — Production Nginx Configuration (HTTP only, IP 기반)
# SSL/도메인 없이 IP 주소로 운영할 때 사용
# 사용법: docker-compose.prod.yml의 nginx volume에서 이 파일을 마운트

upstream frontend {
    server frontend:80;
}

upstream fdd_api {
    server fdd-api:8000;
}

upstream kiis_api {
    server kiis-api:8000;
}

upstream im_api {
    server im-api:8000;
}

upstream deal_mgmt_api {
    server deal-mgmt-api:8000;
}

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ingest.sentry.io;" always;

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # ------------------------------------------------------------------
    # Frontend — proxy to frontend container (내부 nginx가 SPA + 캐싱 처리)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # FDD Backend API — /api/fdd/* → fdd-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/fdd/ {
        rewrite ^/api/fdd/(.*)$ /api/v1/$1 break;
        proxy_pass http://fdd_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # KIIS Backend API — /api/kiis/* → kiis-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/kiis/ {
        rewrite ^/api/kiis/(.*)$ /api/v1/$1 break;
        proxy_pass http://kiis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # IM Backend API — /api/im/* → im-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/im/ {
        rewrite ^/api/im/(.*)$ /api/v1/$1 break;
        proxy_pass http://im_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Deal Management API — /api/ma/* → deal-mgmt-api:8000/api/v1/*
    # ------------------------------------------------------------------
    location /api/ma/ {
        rewrite ^/api/ma/(.*)$ /api/v1/$1 break;
        proxy_pass http://deal_mgmt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
