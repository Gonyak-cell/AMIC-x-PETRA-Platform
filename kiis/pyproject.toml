[project]
name = "kiis"
version = "0.13.0"
description = "Korea Investment Intelligence System - 차세대 지능형 투자정보 통합 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.0",
    "aiosqlite>=0.20.0",
    "kiwipiepy>=0.18.0",
    "rapidfuzz>=3.0.0",
    "scikit-learn>=1.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "elasticsearch[async]>=8.12.0",
    "slack-sdk>=3.27.0",
    "aiosmtplib>=3.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "fakeredis>=2.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line too long — Korean text + data dicts make 120-char limit impractical
    "B008",   # FastAPI Depends() in default args is intentional
    "B904",   # raise-without-from — gradual migration
    "RUF001", # ambiguous unicode char in string — intentional Korean text
    "RUF002", # ambiguous unicode char in docstring — intentional Korean text
    "RUF003", # ambiguous unicode char in comment — intentional Korean text
    "RUF012", # mutable-class-default — Pydantic models use mutable defaults by design
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=xml"
markers = [
    "integration: marks tests that require external API access",
    "e2e: marks end-to-end tests that verify full system flows",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
