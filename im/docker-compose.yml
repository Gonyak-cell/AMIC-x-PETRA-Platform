# Auto-IM Generator Docker Compose (T-I22)
# > 마지막 수정: 2026-02-10 23:30:00

services:
  db:
    image: postgres:16-alpine
    container_name: im-module-postgres
    environment:
      POSTGRES_DB: imgen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - im_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: im-module-redis
    ports:
      - "6380:6379"
    volumes:
      - im_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im-module-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/imgen
      REDIS_URL: redis://redis:6379/0
      REDIS_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - im_output_data:/app/output
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im-module-celery-worker
    command: >
      celery -A src.api.tasks.celery_app worker
      --loglevel=info
      --concurrency=2
      --max-memory-per-child=500000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/imgen
      REDIS_URL: redis://redis:6379/0
      REDIS_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - im_output_data:/app/output
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker containers do not serve the HTTP health endpoint defined in the base image.
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im-module-celery-beat
    command: >
      celery -A src.api.tasks.celery_app beat
      --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/imgen
      REDIS_URL: redis://redis:6379/0
      REDIS_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Beat containers do not serve the HTTP health endpoint defined in the base image.
    healthcheck:
      disable: true

volumes:
  im_postgres_data:
  im_redis_data:
  im_output_data:
