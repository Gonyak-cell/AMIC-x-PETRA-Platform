# Investment Highlights (투자 하이라이트) 템플릿
#
# 마지막 수정: 2026-02-17
# 슬롯 구성: L2 3개 (직접 치환) + L3 5개 (LLM 생성)
# 조건부 블록: L4 4개 (산업별)
section_id: investment_highlights
version: "1.0"
source_reference: "일반 IM 보고서 양식"

slots:
  # ── L2: 단순 치환 ──
  company_name:
    level: L2
    source: company_name_kr

  transaction_type:
    level: L2
    source: deal_structure.transaction_type
    default: "투자유치"

  revenue_latest:
    level: L2
    source: financial_statements.revenue
    default: ""

  # ── L3: LLM 생성 ──
  highlights_overview:
    level: L3
    type: paragraph
    hint: >-
      투자 하이라이트의 전체 개요를 2-3문장으로 서술.
      대상회사의 핵심 투자 매력 포인트를 종합적으로 소개하되,
      구체적 수치보다는 전략적 포지셔닝과 차별화 요소에 집중.
    max_tokens: 100
    data_keys:
      - investment_highlights
      - company_overview.business_model
      - market_data.tam

  highlight_market_position:
    level: L3
    type: paragraph
    hint: >-
      시장 포지션 관점의 투자 매력을 설명. TAM 규모, 시장 점유율,
      경쟁 우위 요소를 수치와 함께 2-3문장으로 서술.
    max_tokens: 100
    data_keys:
      - investment_highlights
      - market_data.tam
      - market_data.market_growth_rate
      - market_data.competitors

  highlight_financial_strength:
    level: L3
    type: paragraph
    hint: >-
      재무적 강점 관점의 투자 매력을 설명. 매출 성장률, EBITDA 마진,
      현금 창출 능력 등 핵심 재무 지표를 근거로 2-3문장으로 서술.
    max_tokens: 100
    data_keys:
      - investment_highlights
      - financial_statements.revenue
      - financial_statements.ebitda
      - derived_metrics

  highlight_growth_potential:
    level: L3
    type: paragraph
    hint: >-
      성장 잠재력 관점의 투자 매력을 설명. 신규 사업 기회,
      해외 확장 가능성, 기술 경쟁력 등을 2-3문장으로 서술.
    max_tokens: 100
    data_keys:
      - investment_highlights
      - growth_strategy.organic_growth
      - growth_strategy.new_business
      - market_data.industry_trends

  highlight_risk_mitigation:
    level: L3
    type: sentence
    hint: >-
      주요 리스크 대응 관점에서 대상회사의 방어적 강점을 1-2문장으로 요약.
      진입장벽, 고객 잠금 효과, 규제 이점 등.
    max_tokens: 60
    data_keys:
      - investment_highlights
      - company_overview.business_model

body: |
  {{@transition_investment}}

  {{company_name}}(이하 "대상회사")에 대한 본 {{transaction_type}} 기회의
  핵심 투자 하이라이트를 제시하면 다음과 같습니다.

  {{highlights_overview}}

  1. 시장 포지션 및 경쟁 우위

  {{highlight_market_position}}
  이러한 시장 내 포지셔닝은 대상회사의 지속적 성장을 뒷받침하는 핵심 기반입니다.

  2. 재무적 건전성 및 수익성

  {{highlight_financial_strength}}
  견고한 재무 실적은 대상회사의 사업 모델의 안정성과 수익 창출 능력을 입증하고 있습니다.

  3. 성장 잠재력

  {{highlight_growth_potential}}
  다양한 성장 동인의 존재는 중장기적 기업 가치 상승의 가시성을 높이고 있습니다.

  4. 리스크 완화 요인

  {{highlight_risk_mitigation}}
  이러한 구조적 방어 요인은 투자 리스크를 효과적으로 완화하고 있습니다.

  {{@closing_positive}}

conditional_blocks:
  - condition: "industry == 'tech'"
    insert_after: highlight_market_position
    text: >-
      특히, 플랫폼 기반의 네트워크 효과와 높은 고객 전환 비용(Switching Cost)은
      경쟁사 대비 뚜렷한 구조적 해자(Moat)를 형성하고 있습니다.

  - condition: "industry == 'healthcare'"
    insert_after: highlight_market_position
    text: >-
      특히, 규제 승인 및 IP 포트폴리오에 기반한 높은 진입장벽은
      경쟁사의 시장 진입을 효과적으로 억제하는 핵심 방어 자산입니다.

  - condition: "industry == 'manufacturing'"
    insert_after: highlight_financial_strength
    text: >-
      특히, 높은 설비 가동률과 지속적인 원가 절감 노력은
      업계 상위 수준의 영업이익률을 유지하는 핵심 동인입니다.

  - condition: "industry == 'financial_services'"
    insert_after: highlight_risk_mitigation
    text: >-
      특히, 금융업 라이선스에 기반한 규제 진입장벽과 안정적인 수수료 수익 구조는
      경기 변동에 따른 실적 변동성을 완화하는 핵심 요인입니다.

includes:
  - transition_investment
  - closing_positive
