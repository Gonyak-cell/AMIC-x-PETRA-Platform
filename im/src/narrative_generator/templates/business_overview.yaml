# Business Overview (사업 현황) 템플릿
#
# 마지막 수정: 2026-02-17
# 슬롯 구성: L2 4개 (직접 치환) + L3 4개 (LLM 생성)
# 조건부 블록: L4 3개 (산업별 + 조건부)
section_id: business_overview
version: "1.0"
source_reference: "일반 IM 보고서 양식"

slots:
  # ── L2: 단순 치환 ──
  company_name:
    level: L2
    source: company_name_kr

  total_revenue:
    level: L2
    source: financial_statements.revenue
    default: ""

  gross_profit:
    level: L2
    source: financial_statements.gross_profit
    default: ""

  key_customers:
    level: L2
    source: key_customers
    default: ""

  # ── L3: LLM 생성 ──
  business_structure:
    level: L3
    type: paragraph
    hint: >-
      전체 사업 구조와 매출 구성을 설명. 주요 사업부 또는 서비스 라인별
      매출 비중과 성장 기여도를 2-3문장으로 분석.
    max_tokens: 120
    data_keys:
      - segment_revenue
      - financial_statements.revenue
      - financial_statements.gross_profit

  segment_analysis:
    level: L3
    type: paragraph
    hint: >-
      사업부별 현황과 성장 동인을 분석. 각 사업부의 시장 포지션,
      성장률, 향후 전망을 2-3문장으로 서술.
    max_tokens: 150
    data_keys:
      - segment_revenue
      - financial_statements.revenue
      - company_overview.key_products

  customer_analysis:
    level: L3
    type: paragraph
    hint: >-
      주요 고객 관계와 매출 안정성을 분석. 고객 집중도,
      장기 계약 비율, 고객 이탈률 등을 2-3문장으로 서술.
    max_tokens: 100
    data_keys:
      - key_customers
      - segment_revenue

  profitability_comment:
    level: L3
    type: sentence
    hint: >-
      매출총이익률 추이와 수익성 개선 요인을 1-2문장으로 요약.
    max_tokens: 60
    data_keys:
      - financial_statements.gross_profit
      - financial_statements.revenue
      - derived_metrics

body: |
  {{company_name}}(이하 "대상회사")의 사업 현황을 살펴보면, {{business_structure}}

  사업부별로 분석하면, {{segment_analysis}}
  이러한 사업 포트폴리오는 매출의 다변화를 통해 특정 사업부 의존 리스크를 완화하고 있습니다.

  주요 고객 관계 측면에서, {{customer_analysis}}
  주요 고객사로는 {{key_customers}} 등이 있으며, 안정적인 거래 관계를 유지하고 있습니다.

  수익성 측면에서, {{profitability_comment}}
  대상회사의 매출총이익 추이는 사업의 질적 성장을 반영하고 있습니다.

conditional_blocks:
  - condition: "industry == 'tech'"
    insert_after: segment_analysis
    text: >-
      특히, 구독 기반 매출(Subscription Revenue)의 높은 비중은
      매출의 반복성(Recurring Nature)과 예측 가능성을 높이는 핵심 구조적 강점입니다.

  - condition: "industry == 'manufacturing'"
    insert_after: profitability_comment
    text: >-
      원재료 가격 변동에 대한 원가 전가 능력(Cost Pass-Through)과
      생산 효율화를 통한 원가 절감 노력이 수익성 개선에 기여하고 있습니다.

  - condition: "has_segment_revenue"
    insert_after: business_structure
    text: ""
