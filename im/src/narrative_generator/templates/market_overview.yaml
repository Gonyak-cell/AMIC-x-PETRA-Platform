# Market Overview (시장 분석) 템플릿
#
# 마지막 수정: 2026-02-17
# 슬롯 구성: L2 5개 (직접 치환) + L3 4개 (LLM 생성)
# 조건부 블록: L4 4개 (산업별)
section_id: market_overview
version: "1.0"
source_reference: "일반 IM 보고서 양식"

slots:
  # ── L2: 단순 치환 ──
  company_name:
    level: L2
    source: company_name_kr

  tam:
    level: L2
    source: market_data.tam
    format: currency
    default: ""

  sam:
    level: L2
    source: market_data.sam
    format: currency
    default: ""

  som:
    level: L2
    source: market_data.som
    format: currency
    default: ""

  market_growth_rate:
    level: L2
    source: market_data.market_growth_rate
    format: percent
    default: ""

  # ── L3: LLM 생성 ──
  market_size_analysis:
    level: L3
    type: paragraph
    hint: >-
      TAM/SAM/SOM 관점에서 시장 규모를 분석. 전체 시장 규모,
      유효 시장, 획득 가능 시장의 관계를 수치와 함께 3-4문장으로 서술.
      시장 성장률(CAGR)과 향후 전망을 포함.
    max_tokens: 150
    data_keys:
      - market_data.tam
      - market_data.sam
      - market_data.som
      - market_data.market_growth_rate
      - market_data.market_cagr

  competitive_landscape:
    level: L3
    type: paragraph
    hint: >-
      경쟁 구도를 분석. 주요 경쟁사의 시장 점유율, 강약점,
      대상회사의 상대적 포지션을 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - market_data.competitors
      - company_overview.key_products
      - financial_statements.revenue

  industry_trends_analysis:
    level: L3
    type: paragraph
    hint: >-
      산업의 핵심 트렌드와 구조적 변화를 분석. 기술 변화, 규제 환경,
      소비자 행태 변화 등 대상회사에 영향을 미치는 주요 동인을 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - market_data.industry_trends
      - market_data.market_growth_rate

  market_position_assessment:
    level: L3
    type: sentence
    hint: >-
      시장 분석을 종합하여 대상회사의 시장 내 포지션과 경쟁 우위를 1-2문장으로 평가.
    max_tokens: 60
    data_keys:
      - market_data.competitors
      - market_data.tam
      - derived_metrics

body: |
  {{@transition_market}}

  {{company_name}}(이하 "대상회사")이 영위하는 시장의 규모 및 성장성, 경쟁 구도,
  주요 트렌드를 분석하면 다음과 같습니다.

  1. 시장 규모 및 성장성

  {{market_size_analysis}}
  대상회사가 속한 시장의 전체 규모(TAM)는 {{tam}} 수준이며,
  유효 시장(SAM) {{sam}}, 획득 가능 시장(SOM) {{som}}으로 추산됩니다.
  시장 성장률은 {{market_growth_rate}} 수준으로, 양호한 성장세를 보이고 있습니다.

  2. 경쟁 구도

  {{competitive_landscape}}
  이러한 경쟁 환경 속에서 대상회사는 차별화된 경쟁력을 바탕으로 시장 지위를 확보하고 있습니다.

  3. 산업 트렌드

  {{industry_trends_analysis}}
  이러한 산업 트렌드는 대상회사의 사업 모델과 성장 전략에 긍정적인 영향을 미칠 것으로 예상됩니다.

  종합하면, {{market_position_assessment}}

conditional_blocks:
  - condition: "industry == 'tech'"
    insert_after: industry_trends_analysis
    text: >-
      특히, 디지털 전환(DX) 가속화와 클라우드/AI 기반 솔루션 수요 확대는
      대상회사의 핵심 사업 영역과 직접적으로 연결되는 구조적 성장 동인입니다.

  - condition: "industry == 'healthcare'"
    insert_after: industry_trends_analysis
    text: >-
      특히, 고령화 가속과 디지털 헬스케어 확산은 바이오/헬스케어 시장의
      구조적 성장을 견인하는 핵심 메가 트렌드입니다.

  - condition: "industry == 'manufacturing'"
    insert_after: competitive_landscape
    text: >-
      제조업 특성상, 설비 투자 규모와 생산 기술 축적에 따른 진입장벽이 존재하며,
      이는 기존 사업자에게 유리한 경쟁 환경을 형성하고 있습니다.

  - condition: "industry == 'financial_services'"
    insert_after: competitive_landscape
    text: >-
      금융업은 규제 라이선스 기반의 높은 진입장벽이 존재하며,
      대형사 위주의 과점적 시장 구조가 경쟁 강도를 제한하고 있습니다.

includes:
  - transition_market
