# Financial Analysis — 물류 산업 오버라이드
#
# 마지막 수정: 2026-02-17
# 기본 템플릿에 플릿 경제성 및 네트워크 효율성 분석 추가
section_id: financial_analysis
version: "1.0"
source_reference: "물류 IM 보고서 양식"

slots:
  # ── 신규 L3: 물류 특화 ──
  fleet_economics_analysis:
    level: L3
    type: paragraph
    hint: >-
      플릿(운송수단) 경제성을 분석. 차량/선박 가동률(Fleet Utilization),
      유류비/매출 비율 추이, 유가 정상화 후 EBITDA 영향,
      IFRS 16 리스부채의 Net Debt 분류를 수치와 함께 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - financial_statements.revenue
      - financial_statements.operating_income
      - financial_statements.ebitda
      - derived_metrics

  network_efficiency_analysis:
    level: L3
    type: paragraph
    hint: >-
      물류 네트워크 효율성을 분석. 톤·km당 매출, 허브-스포크 네트워크 효율,
      라스트마일 비용 구조, 물량 대비 고정비 레버리지 효과를
      수치와 함께 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - financial_statements.revenue
      - financial_statements.gross_profit
      - derived_metrics

body: |
  {{@transition_financial}}

  {{company_name}}(이하 "대상회사")의 재무 실적을 물류업 특수성을
  반영하여 다각도로 분석하면 다음과 같습니다.

  1. 매출 및 수익성 분석

  {{revenue_profitability_analysis}}
  물류업 특성상, 유가 변동이 수익성에 직접적 영향을 미치며,
  유류비를 정상화한 핵심 영업 수익성(Core EBITDA) 관점의 분석이 중요합니다.
  {{@financial_note}}

  2. 플릿 경제성 (Fleet Economics)

  {{fleet_economics_analysis}}
  운송수단의 가동률과 유류비 관리 효율은 물류 기업의 수익성을 좌우하는 핵심 요소이며,
  IFRS 16 적용에 따른 리스부채의 올바른 분류가 기업 가치 평가에 중요합니다.

  3. 네트워크 효율성

  {{network_efficiency_analysis}}
  물류 네트워크의 밀도(Density)와 효율성은 고정비 레버리지의 원천이며,
  물량 증가에 따른 수익성 개선 잠재력을 결정합니다.

  4. 재무 건전성 분석

  {{balance_sheet_analysis}}
  대상회사의 재무 구조는 플릿 투자 및 네트워크 확장을 안정적으로 지원하고 있습니다.

  5. 현금흐름 분석

  {{cash_flow_analysis}}
  물류업의 높은 운송수단 투자 수요를 감안할 때,
  안정적인 영업현금흐름(OCF) 창출은 자체 투자 능력과 부채 상환력을 입증합니다.

  6. 핵심 지표 종합

  {{key_metrics_summary}}
  {{financial_outlook}}

includes:
  - transition_financial
  - financial_note
