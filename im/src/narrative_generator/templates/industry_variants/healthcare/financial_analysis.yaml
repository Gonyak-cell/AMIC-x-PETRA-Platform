# Financial Analysis — 헬스케어/바이오 산업 오버라이드
#
# 마지막 수정: 2026-02-17
# 기본 템플릿에 R&D 파이프라인 분석 및 규제 비용 영향 섹션 추가
section_id: financial_analysis
version: "1.0"
source_reference: "헬스케어/바이오 IM 보고서 양식"

slots:
  # ── 신규 L3: 바이오/헬스케어 특화 ──
  rnd_pipeline_analysis:
    level: L3
    type: paragraph
    hint: >-
      R&D 투자와 파이프라인을 재무적 관점에서 분석.
      R&D/매출 비율, 임상 단계별 비용 구조, 파이프라인 rNPV(위험조정순현재가치),
      자본화 대상 R&D와 비용 처리 R&D의 구분을 수치와 함께 3-4문장으로 서술.
    max_tokens: 150
    data_keys:
      - financial_statements.revenue
      - financial_statements.sga_expenses
      - derived_metrics
      - company_overview.business_model

  regulatory_cost_analysis:
    level: L3
    type: paragraph
    hint: >-
      규제/인허가 비용이 재무에 미치는 영향을 분석.
      FDA/MFDS 승인 비용, GMP 유지 비용, 마일스톤/기술이전 수익의
      비경상 처리 여부를 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - financial_statements.operating_income
      - financial_statements.sga_expenses
      - derived_metrics

body: |
  {{@transition_financial}}

  {{company_name}}(이하 "대상회사")의 재무 실적을 헬스케어/바이오 기업의 특수성을
  반영하여 다각도로 분석하면 다음과 같습니다.

  1. 매출 및 수익성 분석

  {{revenue_profitability_analysis}}
  바이오/헬스케어 기업의 특성상, 마일스톤 수익과 기술이전 대가 등 비경상 항목을
  정상화한 핵심 영업 수익성(Core Operating Profitability) 관점의 분석이 중요합니다.
  {{@financial_note}}

  2. R&D 투자 및 파이프라인 가치 분석

  {{rnd_pipeline_analysis}}
  R&D 투자는 헬스케어 기업의 미래 성장을 결정하는 핵심 자산이며,
  파이프라인의 단계별 진전은 기업 가치에 비선형적 영향을 미칩니다.

  3. 규제/인허가 비용 영향

  {{regulatory_cost_analysis}}
  규제 승인 비용은 일회성 특성이 강하나, GMP 유지 비용 등
  반복적 규제 준수 비용은 정상 영업비용으로 반영하여야 합니다.

  4. 재무 건전성 분석

  {{balance_sheet_analysis}}
  대상회사의 재무 구조는 R&D 집중 투자 단계를 지원하는 안정적인 기반을 제공하고 있습니다.

  5. 현금흐름 분석

  {{cash_flow_analysis}}
  바이오 기업 특성상, 임상 단계에 따른 현금 소모율(Cash Burn Rate) 관리와
  자금 조달 능력이 사업 지속성의 핵심 지표입니다.

  6. 핵심 지표 종합

  {{key_metrics_summary}}
  {{financial_outlook}}

includes:
  - transition_financial
  - financial_note
