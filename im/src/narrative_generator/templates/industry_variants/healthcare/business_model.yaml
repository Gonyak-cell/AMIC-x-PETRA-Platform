# Business Model — 헬스케어/바이오 산업 오버라이드
#
# 마지막 수정: 2026-02-17
# 기본 템플릿에 IP 포트폴리오 및 규제 구조 분석 추가
section_id: business_model
version: "1.0"
source_reference: "헬스케어/바이오 IM 보고서 양식"

slots:
  # ── 신규 L3: 헬스케어 특화 ──
  ip_portfolio_analysis:
    level: L3
    type: paragraph
    hint: >-
      IP(지식재산권) 포트폴리오를 분석. 핵심 특허의 범위와 잔여 수명,
      데이터 독점권(Data Exclusivity), 제네릭/바이오시밀러 방어 전략,
      기술이전(License-out) 이력과 잠재력을 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - company_overview.certifications
      - company_overview.business_model
      - company_overview.key_products

  regulatory_structure:
    level: L3
    type: paragraph
    hint: >-
      규제 환경과 인허가 구조를 분석. 주요 시장(한국/미국/EU/일본)별
      인허가 현황, GMP 인증 수준, 규제 준수 체계를
      2-3문장으로 서술.
    max_tokens: 100
    data_keys:
      - company_overview.certifications
      - company_overview.business_model

body: |
  {{@transition_business_model}}

  {{company_name}}(이하 "대상회사")의 비즈니스 모델을 헬스케어/바이오 기업의 관점에서
  수익 구조, IP 포트폴리오, 경쟁 우위, 가치사슬, 확장성의 관점으로 분석하면 다음과 같습니다.

  1. 비즈니스 모델 개요

  {{business_model_overview}}
  주요 제품/파이프라인은 {{key_products}}이며, {{certifications}} 등의 인증을 보유하고 있습니다.

  2. 수익 구조 (Revenue Model)

  {{revenue_structure}}
  주요 파트너/고객으로는 {{key_customers}} 등이 있으며,
  제품 매출과 기술이전/로열티 수익의 조합으로 수익 기반을 형성하고 있습니다.

  3. IP 포트폴리오 및 규제 자산

  {{ip_portfolio_analysis}}
  {{regulatory_structure}}
  IP와 규제 승인에 기반한 자산은 헬스케어 기업의 가장 핵심적인 가치 동인이며,
  장기적 경쟁 우위의 원천입니다.

  4. 경쟁 우위 및 진입장벽 (Competitive Moats)

  {{competitive_moats}}
  이러한 경쟁 우위 요인은 대상회사의 시장 지위를 장기적으로 보호하는 핵심 자산입니다.

  5. 가치사슬 내 포지션

  {{value_chain_position}}

  종합하면, {{scalability_assessment}}
  대상회사의 비즈니스 모델은 IP 기반의 높은 진입장벽과 파이프라인 확장 잠재력을 동시에 보유하고 있습니다.

includes:
  - transition_business_model
