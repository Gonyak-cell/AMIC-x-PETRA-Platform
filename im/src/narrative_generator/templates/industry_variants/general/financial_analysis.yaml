# Financial Analysis — 일반(General) 산업 오버라이드
#
# 마지막 수정: 2026-02-17
# 기본 템플릿의 산업 중립적 강화 — 벤치마크 비교 분석 추가
# 특정 산업으로 분류되지 않는 기업에 적용
section_id: financial_analysis
version: "1.0"
source_reference: "일반 IM 보고서 양식"

slots:
  # ── 신규 L3: 범용 강화 ──
  peer_comparison_analysis:
    level: L3
    type: paragraph
    hint: >-
      동종업계 비교(Peer Comparison)를 수행. 매출 성장률, EBITDA 마진,
      ROE 등 핵심 지표를 업계 평균/중위값 대비 평가.
      대상회사의 상대적 포지션을 수치와 함께 2-3문장으로 서술.
    max_tokens: 120
    data_keys:
      - derived_metrics
      - financial_statements.revenue
      - financial_statements.ebitda
      - market_data.competitors

body: |
  {{@transition_financial}}

  {{company_name}}(이하 "대상회사")의 재무 실적을 다각도로 분석하면 다음과 같습니다.

  1. 매출 및 수익성 분석

  {{revenue_profitability_analysis}}
  {{@financial_note}}

  2. 재무 건전성 분석

  {{balance_sheet_analysis}}
  대상회사의 재무 구조는 안정적인 사업 운영의 기반을 제공하고 있습니다.

  3. 현금흐름 분석

  {{cash_flow_analysis}}
  지속적인 잉여현금흐름(FCF) 창출 능력은 대상회사의 재무적 유연성을 뒷받침하고 있습니다.

  4. 동종업계 비교 분석 (Peer Comparison)

  {{peer_comparison_analysis}}
  동종업계 대비 대상회사의 재무 지표는 사업 모델의 경쟁력을 객관적으로 평가하는 기준을 제공합니다.

  5. 핵심 지표 종합

  {{key_metrics_summary}}
  {{financial_outlook}}

includes:
  - transition_financial
  - financial_note
