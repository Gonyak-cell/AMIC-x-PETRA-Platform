# Executive Summary (경영진 요약) 템플릿
#
# 마지막 수정: 2026-02-17
# 슬롯 구성: L2 5개 (직접 치환) + L3 5개 (LLM 생성)
# 조건부 블록: L4 4개 (산업별)
section_id: executive_summary
version: "1.0"
source_reference: "일반 IM 보고서 양식"

slots:
  # ── L2: 단순 치환 ──
  company_name:
    level: L2
    source: company_name_kr

  transaction_type:
    level: L2
    source: deal_structure.transaction_type
    default: "투자유치"

  report_date:
    level: L2
    source: date
    format: date
    default: "2026년"

  tam_value:
    level: L2
    source: market_data.tam
    format: currency
    default: ""

  revenue_latest:
    level: L2
    source: financial_statements.revenue
    default: ""

  # ── L3: LLM 생성 ──
  company_intro:
    level: L3
    type: paragraph
    hint: "기업의 핵심 사업, 설립 연도, 시장 포지션을 2-3문장으로 소개. 투자자가 기업의 정체성을 즉시 파악할 수 있도록 작성."
    max_tokens: 100
    data_keys:
      - company_name_kr
      - company_overview.business_model
      - company_overview.established_date
      - company_overview.key_products

  revenue_highlight:
    level: L3
    type: sentence
    hint: "최근 연도 매출액, 매출 성장률(YoY 또는 CAGR), EBITDA 마진을 포함한 재무 하이라이트 1-2문장."
    max_tokens: 80
    data_keys:
      - financial_statements.revenue
      - financial_statements.ebitda
      - derived_metrics

  ebitda_comment:
    level: L3
    type: sentence
    hint: "EBITDA 수준과 수익성 개선 추이를 설명하는 1문장."
    max_tokens: 60
    data_keys:
      - financial_statements.ebitda
      - financial_statements.operating_income
      - derived_metrics

  market_opportunity:
    level: L3
    type: paragraph
    hint: "대상회사가 속한 시장의 규모, 성장률, 핵심 트렌드를 설명. 시장 기회가 대상회사에 어떤 의미인지 연결."
    max_tokens: 100
    data_keys:
      - market_data.tam
      - market_data.market_growth_rate
      - market_data.industry_trends

  investment_appeal:
    level: L3
    type: paragraph
    hint: "투자 하이라이트를 종합하여 핵심 투자 매력 포인트를 2-3문장으로 요약."
    max_tokens: 100
    data_keys:
      - investment_highlights
      - company_overview.business_model
      - derived_metrics

body: |
  {{company_name}}(이하 "대상회사")은 {{company_intro}}

  재무적 측면에서, 대상회사는 {{revenue_highlight}} {{ebitda_comment}}
  이러한 재무 성과는 대상회사의 사업 모델의 견고함을 입증하고 있습니다.

  시장 환경 측면에서, {{market_opportunity}}
  이러한 시장 동향은 대상회사에게 유의미한 성장 기회를 제공하고 있습니다.

  종합하면, {{investment_appeal}}
  본 {{transaction_type}} 기회는 투자자에게 매력적인 수익 창출 기회를 제공할 것으로 기대됩니다.

conditional_blocks:
  - condition: "industry == 'tech'"
    insert_after: ebitda_comment
    text: "특히, SaaS 기반 반복 매출(Recurring Revenue) 구조는 매출의 예측 가능성과 안정성을 높이고 있으며,"

  - condition: "industry == 'healthcare'"
    insert_after: ebitda_comment
    text: "특히, 바이오/헬스케어 분야의 규제 장벽과 IP 포트폴리오는 강력한 경쟁 우위를 형성하고 있으며,"

  - condition: "industry == 'manufacturing'"
    insert_after: ebitda_comment
    text: "특히, 안정적인 설비 가동률과 원가 경쟁력은 수익성의 지속 가능성을 뒷받침하고 있으며,"

  - condition: "industry == 'financial_services'"
    insert_after: ebitda_comment
    text: "특히, 규제 라이선스 기반의 진입장벽과 안정적인 수수료 수익 구조는 사업의 지속 가능성을 뒷받침하고 있으며,"
