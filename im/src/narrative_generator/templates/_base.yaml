# 공통 부동문자 블록 (모든 섹션에서 참조 가능)
# 사용법: 섹션 YAML body에서 {{@block_name}} 형태로 참조
#
# 마지막 수정: 2026-02-17
version: "1.0"

blocks:
  # ── 면책조항 ──
  - name: disclaimer_short
    text: >-
      본 자료는 정보 제공 목적으로만 작성되었으며,
      투자 권유를 구성하지 않습니다.

  - name: disclaimer_full
    text: >-
      본 자료는 정보 제공 목적으로만 작성되었으며, 투자 권유를 구성하지 않습니다.
      본 자료에 포함된 정보의 정확성, 완전성 또는 신뢰성에 대해 어떠한 보증도 하지 않으며,
      본 자료의 수령인은 본 자료에 포함된 정보에만 의존하여 투자 결정을 내려서는 안 됩니다.
      본 자료의 내용 중 일부는 미래에 대한 진술을 포함할 수 있으며,
      이러한 진술은 불확실성을 수반하므로 실제 결과와 다를 수 있습니다.

  # ── 비밀유지 ──
  - name: confidentiality
    text: >-
      본 자료는 비밀유지 의무가 수반되는 문서로서, 수령인의 사전 서면 동의 없이
      제3자에게 공개, 배포 또는 복제할 수 없습니다.
      본 자료의 수령은 비밀유지 계약(NDA)의 적용을 받습니다.

  # ── 연결 문구 (섹션 간 전환) ──
  - name: transition_financial
    text: >-
      이하에서는 대상회사의 재무 실적을 상세히 분석하겠습니다.

  - name: transition_market
    text: >-
      다음으로, 대상회사가 영위하는 시장 환경 및 경쟁 구도를 살펴보겠습니다.

  - name: transition_deal
    text: >-
      다음으로, 본 거래의 구조 및 핵심 조건을 설명하겠습니다.

  - name: transition_investment
    text: >-
      이하에서는 본 투자 기회의 핵심 매력 포인트를 제시하겠습니다.

  - name: transition_strategy
    text: >-
      다음으로, 대상회사의 성장 전략 및 가치 창출 방안을 살펴보겠습니다.

  - name: transition_value_creation
    text: >-
      이하에서는 본 투자를 통한 가치 창출 방안 및 구체적 실행 전략을 제시하겠습니다.

  - name: transition_management
    text: >-
      다음으로, 대상회사의 경영진 구성 및 핵심 인력 역량을 소개하겠습니다.

  - name: transition_business_model
    text: >-
      다음으로, 대상회사의 비즈니스 모델과 수익 구조를 분석하겠습니다.

  - name: transition_appendix
    text: >-
      이하 부록에서는 상세 재무 데이터 및 보충 자료를 수록하겠습니다.

  # ── 공통 마무리 문구 ──
  - name: closing_positive
    text: >-
      상기 내용을 종합할 때, 대상회사는 견고한 사업 기반과 명확한 성장 전략을
      보유하고 있으며, 투자자에게 매력적인 투자 기회를 제공할 것으로 판단됩니다.

  - name: closing_neutral
    text: >-
      상기 분석 내용은 제공된 자료를 기반으로 작성되었으며,
      추가적인 실사 과정에서 보완될 수 있습니다.

  # ── 수치 주석 ──
  - name: financial_note
    text: >-
      (주: 상기 재무 수치는 감사보고서 기준이며, 관리회계 기준과 차이가 있을 수 있습니다)

  - name: projection_caveat
    text: >-
      (주: 추정치는 경영진 제공 사업계획에 기반하며, 실제 결과와 상이할 수 있습니다)
