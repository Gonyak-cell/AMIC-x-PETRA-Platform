[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: 느린 테스트 (deselect: -m 'not slow')",
    "requires_browser: Playwright 브라우저 필요",
    "requires_plotly: Plotly + Kaleido 필요",
    "requires_weasyprint: WeasyPrint + cairo/pango 필요",
    "deterministic: 동일 입력 2회 렌더 SSIM 검증 — 템플릿 파일 + FORCE_VISUAL_DIFF 필요, slow에 포함",
]
